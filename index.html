<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1a12">
<title>FootLife - 足球人生模擬器</title>
<meta name="description" content="從青訓到世界盃，一場種子化的足球員生涯模擬。簽約、租借、轉會、國家隊、傷病、引退——每一個決定都算數。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23fff%22 stroke=%22%23222%22/%3E%3Cpolygon points=%2216,10 21,14 19,20 13,20 11,14%22 fill=%22%23222%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1a12; --panel:#132920; --panel2:#1a382a; --edge:#2b4d3a;
  --chalk:#ece7d6; --dim:#93ab9c; --amber:#ffc95c; --clay:#c9764a;
  --good:#8fd08f; --bad:#e2695c; --blue:#7fb3d5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--sans);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#16352644 0%,transparent 60%);}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* ---------- 記分板 ---------- */
#board{position:sticky;top:0;z-index:20;background:linear-gradient(#173125,#122519);
  border-bottom:2px solid var(--edge);padding:10px 14px 8px;box-shadow:0 6px 18px #0009}
#bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#bd-name{font-weight:900;font-size:17px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-name small{color:var(--dim);font-weight:500;font-size:12px;margin-left:6px}
#bd-team{color:var(--amber);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#bd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bd-cell{background:#0d2115;border:1px solid var(--edge);border-radius:6px;padding:4px 6px 3px;text-align:center}
.bd-cell b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--amber);
  text-shadow:0 0 8px #ffc95c55;line-height:1.2}
.bd-cell span{font-size:10px;color:var(--dim);letter-spacing:.15em}
#lamps{display:flex;gap:14px;justify-content:center;margin-top:7px}
.lamp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.lamp i{width:9px;height:9px;border-radius:50%;background:#243c2e;border:1px solid #35543f;display:inline-block}
.lamp.on{color:var(--chalk)} .lamp.on i{background:var(--amber);box-shadow:0 0 8px var(--amber);border-color:var(--amber)}
/* ---------- 主紀錄 ---------- */
#log{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;
  animation:pop .25s ease;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;gap:8px}
.card h4::before{content:'';width:8px;height:8px;background:var(--clay);border-radius:2px;transform:rotate(45deg);flex:none}
.card.gold h4::before{background:var(--amber)} .card.bad h4::before{background:var(--bad)}
.card.good h4::before{background:var(--good)} .card.info h4::before{background:var(--blue)}
.card p{font-size:14px} .card p+p{margin-top:4px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:4px;
  background:#0d2115;border:1px solid var(--edge);color:var(--amber);margin:0 2px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--amber);font-weight:700}
.statline{font-family:var(--mono);font-size:12.5px;color:var(--chalk);background:#0d2115;border:1px dashed var(--edge);
  border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.7}
table.fin{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:6px}
table.fin th,table.fin td{border-bottom:1px solid var(--edge);padding:4px 4px;text-align:right}
table.fin th{color:var(--dim);font-weight:500;letter-spacing:.05em}
table.fin td:first-child,table.fin th:first-child{text-align:left}
.divider{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.4em;padding:6px 0 0}
.yr-head{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.3em;padding:8px 0 0;cursor:pointer;user-select:none}
.yr-head:hover{color:var(--amber)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.collapsed .yr-head::after{content:' ▸'}
.yr-block:not(.collapsed) .yr-head.has-body::after{content:' ▾'}
.divider::before,.divider::after{content:'———'}
/* ---------- 操作區 ---------- */
#act{position:sticky;bottom:0;z-index:20;background:linear-gradient(#122519ee,#0b1a12);border-top:2px solid var(--edge);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
#act .title{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;font-weight:700}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--chalk);
  font-family:var(--sans);font-size:15px;font-weight:700;border-radius:10px;padding:11px 14px;margin-top:8px;
  cursor:pointer;text-align:left;transition:.15s}
.btn:active{transform:scale(.98)} .btn:hover{border-color:var(--amber)}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.btn.main{background:linear-gradient(#2a5038,#1f3f2c);border-color:#3c6a4c;text-align:center}
.btn.warn{border-color:#6a3c3c}
/* 骰子 */
#dice{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.die{width:44px;height:44px;border-radius:9px;background:var(--chalk);color:#12251a;font-family:var(--mono);
  font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 0 #0003;position:relative}
.die::after{content:'';position:absolute;inset:4px;border-radius:6px;border:1.5px dashed #c9764a55}
.die.used{opacity:.22;transform:scale(.9)} .die.active{outline:3px solid var(--amber);outline-offset:2px}
.die.six{color:#b3402f}
.pool{font-family:var(--mono);font-size:15px;color:var(--amber);margin-bottom:10px}
.abrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:8px;padding:7px 10px;margin-top:6px;cursor:pointer;user-select:none}
.abrow:active{background:var(--panel2)}
.abrow .nm{width:74px;font-size:13.5px;font-weight:700;flex:none}
.abrow .bar{flex:1;height:8px;background:#0d2115;border-radius:4px;overflow:hidden}
.abrow .bar i{display:block;height:100%;background:linear-gradient(90deg,#3c6a4c,var(--amber));border-radius:4px;transition:.2s}
.abrow .val{font-family:var(--mono);width:58px;text-align:right;font-size:14px;flex:none}
.abrow .val b{color:var(--good)}
.abrow.capped{opacity:.45}
#act .row2{display:flex;gap:8px}#act .row2 .btn{flex:1;text-align:center}
/* 開場 */
#start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,#1d4630aa,transparent 60%)}
#start .wrap{max-width:560px;margin:0 auto;padding:40px 22px 60px}
#start h1{font-size:34px;font-weight:900;letter-spacing:.08em;line-height:1.25;margin-top:18px}
#start h1 em{font-style:normal;color:var(--amber)}
#start .sub{color:var(--dim);margin:10px 0 26px;font-size:13.5px;letter-spacing:.08em}
.field{margin-top:18px}
.field label{display:block;font-size:12px;letter-spacing:.25em;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--chalk);
  font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none}
.field input:focus{border-color:var(--amber)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--dim);
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:11px 4px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--amber);border-color:var(--amber)}
.seedline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:22px}
.seedline b{color:var(--amber)}
.stitch{width:64px;height:64px;border-radius:50%;background:var(--chalk);position:relative;box-shadow:inset -6px -8px 0 #00000014}
.stitch::before,.stitch::after{content:'';position:absolute;top:8px;bottom:8px;width:18px;
  border:3px dashed #b3402f;border-top:none;border-bottom:none}
.stitch::before{left:8px;border-right:none;border-radius:50% 0 0 50%}
.stitch::after{right:8px;border-left:none;border-radius:0 50% 50% 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{position:relative}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffc95c66;border-radius:1px}
#btn-restart{background:none;border:1px solid #2b4a38;color:#8fae9c;border-radius:8px;
 font-size:14px;line-height:1;padding:4px 8px;margin-left:8px;cursor:pointer;flex:none}
#btn-restart:active{background:#12271b}
#act-toggle{display:block;margin:0 auto -4px;background:#0e2015;border:1px solid #2b4a38;
 border-bottom:none;color:#8fae9c;font-size:11px;padding:3px 14px;border-radius:10px 10px 0 0;cursor:pointer}
#act.collapsed{display:none!important}
.ball{width:64px;height:64px;border-radius:50%;background:var(--chalk);position:relative;box-shadow:inset -6px -8px 0 #00000014}
.ball::before{content:'';position:absolute;left:21px;top:20px;width:22px;height:22px;background:#12251a;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
</style>
</head>
<body>
<div id="start">
  <div class="wrap">
    <div class="ball"></div>
    <h1 id="logo-tap">FootLife<br><em>足球人生模擬器</em></h1>
    <div id="ver-badge" style="position:fixed;top:6px;right:8px;font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.55;font-family:monospace;z-index:50;pointer-events:none"></div>
    <p class="sub">青訓三年養成 → 職業合約・旅外 → 國家隊 → 衰退與引退。每一顆骰子都算數。</p>
    <div class="field"><label>球員姓名</label><input id="in-name" maxlength="10" placeholder="例如：陳柏良" value=""></div>
    <div class="field"><label>位置</label>
      <div class="seg" id="seg-pos">
        <button data-v="GK">門將</button><button data-v="DF">後衛</button>
        <button data-v="MF">中場</button><button data-v="FW" class="on">前鋒</button>
      </div></div>
    <div class="field"><label>國籍</label>
      <div class="seg" id="seg-nat">
        <button data-v="TW" class="on">台灣</button><button data-v="JP">日本</button><button data-v="KR">韓國</button><button data-v="AU">澳洲</button>
        <button data-v="CN">中國</button><button data-v="VN">越南</button><button data-v="TH">泰國</button>
      </div><p id="nat-desc" style="color:var(--dim);font-size:12px;margin-top:6px"></p></div>
    <button class="btn main" style="margin-top:28px" id="btn-start">開始生涯 ▸ 15 歲・青訓第一年</button>
    <p class="seedline">世界種子
      <input id="seed-show" maxlength="24" style="width:120px;background:#0e2015;color:#ffc95c;border:1px solid #2b4a38;border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px;text-align:center">
      · <a href="#" id="seed-re" style="color:var(--blue)">換一個</a><br>相同種子＋相同選擇＝相同人生（可直接輸入朋友的種子碼）</p>
  </div>
</div>
<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><button id="btn-restart" title="重新開始">↺</button></div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">15</b><span>年齡</span></div>
      <div class="bd-cell"><b id="bd-year">2026</b><span>賽季</span></div>
      <div class="bd-cell"><b id="bd-ovr">30</b><span>綜合</span></div>
      <div class="bd-cell"><b id="bd-sal">0</b><span>生涯薪(萬)</span></div>
    </div>
    <div id="lamps">
      <span class="lamp" id="lp0"><i></i>季前</span>
      <span class="lamp" id="lp1"><i></i>賽季中</span>
      <span class="lamp" id="lp2"><i></i>季末</span>
    </div>
  </header>
  <main id="log"></main>
  <button id="act-toggle" style="display:none">⌄ 收合選項</button>
  <footer id="act" style="display:none"></footer>
</div>
<script>
/* ================= RNG（種子化） ================= */
let SEED = new URLSearchParams(location.search).get('seed') || Math.random().toString(36).slice(2,10);
let _s = 0;
function seedInit(str){ _s = 1779033703; for(let i=0;i<str.length;i++){ _s = Math.imul(_s ^ str.charCodeAt(i), 3432918353); _s = _s<<13 | _s>>>19; } }
function R(){ _s|=0; _s = _s + 0x6D2B79F5 |0; let t = Math.imul(_s ^ _s>>>15, 1|_s); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const chance=p=>R()*100<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;} return a; }
function scrollBottom(){ /* iOS Safari 於 iframe 內平滑滾動易觸發白畫面,改用同步滾動+rAF */
  try{ requestAnimationFrame(function(){ window.scrollTo(0, document.body.scrollHeight); }); }
  catch(e){ try{ window.scrollTo(0, document.body.scrollHeight); }catch(_){} }
}
const N0=(sd)=> (R()+R()+R()+R()-2)/2*sd*2; /* 近似常態 */

/* ================= 靜態資料 ================= */
const APP_VER='v0.6.0-M5';
const ABL={sta:'體能',pac:'速度',sho:'射門',pas:'傳球',dri:'盤帶',def:'防守',phy:'對抗',hea:'頭球',vis:'視野',
  ref:'撲救',gkp:'站位',cmd:'出擊指揮',kic:'腳下技術'};
const OUT_AB=['sta','pac','sho','pas','dri','def','phy','hea','vis'];
const GRP_AB={GK:['sta','ref','gkp','cmd','kic'],DF:OUT_AB,MF:OUT_AB,FW:OUT_AB};
const GRPN={GK:'門將',DF:'後衛',MF:'中場',FW:'前鋒'};
const DPN={GK:'門將',CB:'中衛',FB:'邊後衛',DM:'後腰',CM:'中前衛',AM:'前腰',W:'邊鋒',SS:'影鋒',ST:'中鋒'};
/* 各位置 OVR 權重(合計 1.0),其餘能力不計 */
const DP_W={
  GK:{ref:.35,gkp:.30,cmd:.20,kic:.15},
  CB:{def:.35,phy:.25,hea:.25,pas:.15}, FB:{def:.30,pac:.30,sta:.20,pas:.20},
  DM:{def:.35,pas:.30,phy:.20,vis:.15}, CM:{pas:.35,vis:.25,sta:.20,def:.20}, AM:{vis:.30,pas:.30,dri:.25,sho:.15},
  W:{pac:.30,dri:.35,sho:.20,pas:.15}, ST:{sho:.45,phy:.20,hea:.20,pac:.15}, SS:{sho:.35,dri:.30,vis:.20,pac:.15}};
const DP_MULT={GK:.90,CB:.95,FB:.95,DM:1.0,CM:1.05,AM:1.10,W:1.10,ST:1.20,SS:1.15}; /* 身價/薪資倍率 */
const DP_DEFAULT={GK:'GK',DF:'CB',MF:'CM',FW:'ST'};
const DP_OF={GK:['GK'],DF:['CB','FB'],MF:['DM','CM','AM'],FW:['ST','SS','W']}; /* 轉位審查範圍:同大類 */
const DP_ADJ={W:['FB'],FB:['W'],AM:['W']}; /* 跨大類的相鄰位置(邊鋒↔邊後衛、前腰→邊鋒) */
const GOAL_BASE={ST:.45,SS:.38,W:.30,AM:.22,CM:.10,DM:.04,FB:.03,CB:.05,GK:0}; /* 每 90 分鐘 */
const AST_BASE={AM:.28,W:.25,SS:.20,ST:.15,CM:.15,FB:.10,DM:.06,CB:.02,GK:0};
/* 青訓隊:隱藏分級 T1 名門(競爭激烈)/T2 中堅/T3 弱旅(容易上場) */
const YOUTH={'北區足球學院':1,'南區足球學院':1,'中部體育高中':2,'東部體育高中':2,'社區業餘隊':3,'偏鄉足球隊':3};
const YOUTH_PAR={1:30,2:27,3:24};
/* 聯賽:par 基準、min 簽約門檻、g 輪數、sal 年薪基準(萬台幣)、cty 隊友姓名來源
   rel 降級去處、up 升級去處、wp 需工作證(弱國球員 OVR ≥ par+3)、eu 歐洲聯賽、top5 五大聯賽、local 只簽本國球員 */
const LV={
  ENG:{n:'英超',par:60,min:57,g:38,sal:15000,cty:'EU',rel:'EFL',wp:1,eu:1,top5:1},
  ESP:{n:'西甲',par:59,min:56,g:38,sal:12000,cty:'EU',rel:'ESP2',eu:1,top5:1},
  GER:{n:'德甲',par:58,min:55,g:34,sal:10000,cty:'EU',rel:'GER2',eu:1,top5:1},
  ITA:{n:'義甲',par:58,min:55,g:38,sal:10000,cty:'EU',rel:'ITA2',eu:1,top5:1},
  FRA:{n:'法甲',par:56,min:53,g:34,sal:7000,cty:'EU',rel:'FRA2',eu:1,top5:1},
  EFL:{n:'英冠',par:52,min:49,g:46,sal:3000,cty:'EU',up:'ENG',wp:1,eu:1},
  NED:{n:'荷甲',par:51,min:48,g:34,sal:2500,cty:'EU',eu:1},
  POR:{n:'葡超',par:51,min:48,g:34,sal:2500,cty:'EU',eu:1},
  BEL:{n:'比甲',par:51,min:48,g:34,sal:2500,cty:'EU',eu:1},
  ESP2:{n:'西乙',par:50,min:47,g:42,sal:2000,cty:'EU',up:'ESP',eu:1},
  GER2:{n:'德乙',par:50,min:47,g:34,sal:2000,cty:'EU',up:'GER',eu:1},
  ITA2:{n:'義乙',par:49,min:46,g:38,sal:1500,cty:'EU',up:'ITA',eu:1},
  FRA2:{n:'法乙',par:48,min:45,g:38,sal:1500,cty:'EU',up:'FRA',eu:1},
  J1:{n:'日 J1',par:47,min:44,g:38,sal:1500,cty:'JP',rel:'J2'},
  K1:{n:'韓 K1',par:45,min:42,g:38,sal:1000,cty:'KR',rel:'K2'},
  J2:{n:'日 J2',par:40,min:36,g:42,sal:400,cty:'JP',up:'J1'},
  K2:{n:'韓 K2',par:40,min:36,g:36,sal:300,cty:'KR',up:'K1'},
  CSL:{n:'中超',par:44,min:40,g:30,sal:1200,cty:'CN',rel:'CHN2'},
  AUS:{n:'澳超',par:43,min:39,g:26,sal:600,cty:'AU'},
  CHN2:{n:'中甲',par:37,min:33,g:30,sal:200,cty:'CN',up:'CSL',local:1},
  THA:{n:'泰超',par:36,min:32,g:30,sal:250,cty:'TH',local:1},
  VIE:{n:'越南 V 聯賽',par:34,min:30,g:26,sal:120,cty:'VN',local:1},
  TW1:{n:'台灣企甲',par:33,min:28,g:21,sal:80,cty:'TW',local:1},

/* 成本曲線:OVR 只計 4 項能力、集中加點效率高,所以中高段比棒球版陡;門將只有 5 項,更陡 */
function stepCost(cur){ return isGK()?(cur>=60?7:cur>=53?4:cur>=46?2:1):(cur>=62?5:cur>=55?3:cur>=47?2:1); }
function abCost(k){ /* 目前這一級要花幾點(須與 addAb 成本公式一致) */
  const cur=S.ab[k], pk=(S.pot&&S.pot[k])||62;
  let c=stepCost(cur); if(cur>=pk)c*=isGK()?4:3; return c;
}
function addAb(k,v){ if(!(k in S.ab))return 0; const o=S.ab[k];
  if(v<0){ S.ab[k]=clamp(o+v,1,80); return S.ab[k]-o; } /* 扣值 1:1,不吃量表成本 */
  let cur=o,bud=v+(S.carry[k]||0); /* 未滿一級的點數累積在進度槽 */
  const pk=(S.pot&&S.pot[k])||62;
  while(bud>0&&cur<80){
    let cost=stepCost(cur); if(cur>=pk)cost*=isGK()?4:3; /* 天花板之上:門將×4、場上×3 */
    if(bud>=cost){bud-=cost;cur++;} else break; }
  S.carry[k]=cur>=80?0:bud;
  S.ab[k]=cur; return cur-o; }

    keys.forEach(k=>{ const v=S.ab[k],cap=v>=80;

      const pk=(S.pot&&S.pot[k])||62, cst=abCost(k), cr=(S.carry&&S.carry[k])||0;
      const key=DP_W[S.dpos][k]?' style="color:var(--amber)"':''; /* 目前位置計入 OVR 的能力標亮 */
      r.innerHTML=`<span class="nm"${key}>${ABL[k]}</span><span class="bar"><i style="width:${v/80*100}%"></i><em style="left:${pk/80*100}%"></em></span><span class="val" style="line-height:1.1">${v}<small style="opacity:.5">/${pk}</small>${cst>1?`<span style="display:block;opacity:.5;font-size:10.5px;letter-spacing:1px;margin-top:-2px">${cr}/${cst}</span>`:''}</span>`;
      if(!cap&&remaining()>0)r.onclick=()=>{ const amt=dice?dice[idx]:1;
        const pc=(S.carry&&S.carry[k])||0;
        const got=addAb(k,amt); hist.push([k,got,pc]); if(dice)idx++; else pool--;
        render(); board(0); };
      rows.appendChild(r); });
    btm.innerHTML='';
    const u=document.createElement('button'); u.className='btn'; u.style.textAlign='center';
    u.textContent='↩ 復原'; u.disabled=!hist.length;
    u.style.opacity=hist.length?'1':'0.35'; u.style.cursor=hist.length?'pointer':'default';
    if(hist.length)u.onclick=()=>{ const [k,got,pc]=hist.pop(); S.ab[k]-=got; S.carry[k]=pc; if(dice)idx--; else pool++; render(); board(0); };
    btm.appendChild(u);
    const allCap=keys.every(k=>S.ab[k]>=80);
    if(remaining()===0||allCap){ const c=document.createElement('button'); c.className='btn main';
      c.textContent=(remaining()>0&&allCap)?'能力已達上限，捨棄剩餘骰子 ▸':'確認 ▸';
      c.onclick=()=>{ actClear(); done(); }; btm.appendChild(c); }
    actToggleSync();
  }
  render();
}

/* ================= 年度流程 ================= */
function nextStep(){ if(S.done){ stepQ=[]; return; } const f=stepQ.shift(); if(f)f(); }
function stageLabel(){
  if(S.stage==='YOUTH')return '青訓第'+['一','二','三'][S.stageYr-1]+'年';
  return LV[S.lv].n;
}
function startYear(){ stepQ=[phasePre,phaseMid,phaseEnd]; divider(`${seasonLabel(S.year)} 賽季 · ${S.age} 歲 · ${stageLabel()}`); nextStep(); }
function advance(){ S.age++; S.year++; if(S.stage==='YOUTH')S.stageYr++; startYear(); }

/* ---------- 季前 ---------- */
function phasePre(){
  board(0); S.tmpInj=0; S.seasonFactor=1; S.skipMid=false;
  if(S.age>=(isGK()?42:40)){ endGame(`體能已到極限，${S.year} 年夏天宣布引退。`); return; }
  /* 年齡衰退:場上 31 歲起、門將 33 歲起;速度/體能加倍,傳球/視野幾乎不退 */
  const declAge=S.age-(S.traits.disc?2:0), declStart=isGK()?33:31;
  if(declAge>=declStart){ const n=declAge-declStart, dec=n>=4?4+(n-4):2;
    const mul={pac:2,sta:2,vis:.25,pas:.25};
    GRP_AB[S.grp].forEach(k=>{ const d=Math.round(dec*(mul[k]??1)); if(d>0)S.ab[k]=clamp(S.ab[k]-d,1,80); });
    card('bad','歲月不饒人',`${n>=4?'第二階段（逐年加劇）':'第一階段'}衰退：能力 <b class="dn">−${dec}</b>，速度與體能加倍流失，傳球與視野幾乎不受影響。`); board(0); }
  if(S.rehab>0){ S.rehab--; S.skipMid=true; S.seasonFactor=0;
    card('bad','復健年','重傷尚未痊癒，本季確定<b class="dn">全年報銷</b>。（擲骰減為 2 顆）'); }
  if(S.milNext){ S.milNext=false; S.mil='served'; S.seasonFactor*=0.6;
    card('info','服役年','本季一邊服役一邊踢球，出賽時間減少。服役結束後就沒有後顧之憂了。'); }
  posReview(()=>squadReview(training));
}
/* 位置審查:同大類或相鄰位置 OVR 高 4 以上,教練提議轉位 */
function posReview(cont){
  if(S.skipMid||(S.stage==='YOUTH'&&S.stageYr<2)){ cont(); return; }
  const cur=ovrAt(S.dpos); let best=S.dpos, bv=cur;
  [...DP_OF[S.grp],...(DP_ADJ[S.dpos]||[])].forEach(dp=>{ const v=ovrAt(dp); if(v>bv){bv=v;best=dp;} });
  if(best===S.dpos||bv-cur<4){ cont(); return; }
  choose(`教練建議轉任${DPN[best]}（綜合 ${cur} → ${bv}）`,[
    {t:`接受，改踢${DPN[best]}`,main:true,f:()=>{ const old=DPN[S.dpos]; S.dpos=best; S.rivals=[]; /* 換位置就換一批競爭者 */
      if(++S.posChanges>=2&&!S.traits.versatile)traitCard('versatile','教練要你踢哪裡，你就能踢哪裡——<b class="hl">拒絕轉位不再影響上場時間</b>。');
      card('info','位置調整',`從${old}轉任 <b class="hl">${DPN[best]}</b>，綜合評價 ${cur} → <b class="up">${bv}</b>。`); board(0); cont(); }},
    {t:`堅持踢${DPN[S.dpos]}`,warn:true,s:S.traits.versatile?'全能戰士：不影響上場時間':'本季上場地位降一級',f:()=>{ if(!S.traits.versatile)S.roleAdj--;
      card('bad','堅持己見',`你拒絕轉位，教練不太高興，本季上場時間會受影響。`); cont(); }}]);
}
/* ---------- 隊內競爭:同位置 1–2 名虛擬隊友,OVR 落在球隊 par −6～+10 ---------- */
function curPar(){ return S.stage==='YOUTH'?YOUTH_PAR[S.youthTier]:LV[S.lv].par+TIER_PAR[S.clubTier]; }
function rivalName(){ const L=NAMES[S.stage==='PRO'?LV[S.lv].cty:'TW']; return pick(L[0])+pick(L[1]); }
function newRival(){ return {name:rivalName(),ovr:clamp(curPar()+ri(-6,10),15,80),age:S.stage==='YOUTH'?S.age+ri(-1,1):ri(19,31)}; }
const roleOf=gap=>gap>=3?0:gap>=-2?1:gap>=-7?2:3;
const rivalTop=()=>S.rivals.length?Math.max(...S.rivals.map(r=>r.ovr)):0;
function squadReview(cont){
  if(S.skipMid){ cont(); return; }
  const gone=[];
  S.rivals.forEach(r=>{ r.age++; r.ovr=clamp(r.ovr+(r.age<=26?ri(0,3):r.age<=30?ri(-1,1):-ri(1,3)),15,80); });
  S.rivals=S.rivals.filter(r=>{ if(r.age>=34||chance(20)){ gone.push(r.name); return false; } return true; });
  fillRivals(gone.length?`${gone.join('、')} 離隊。`:'');
  cont();
}
/* 補滿同位置競爭者並公告;隊上原本就有人時,新加入者標「新援」 */
function fillRivals(intro){
  const fresh=!S.rivals.length, news=[], want=isGK()?1:ri(1,2);
  while(S.rivals.length<want){ const r=newRival(); S.rivals.push(r); news.push(r); }
  const mine=ovr(), role=roleOf(mine-rivalTop());
  const list=S.rivals.map(r=>`${r.name}（${r.age} 歲・綜合 ${r.ovr}）${!fresh&&news.includes(r)?'<b class="hl">新援</b>':''}`).join('、');
  card('info','位置競爭',`${intro||''}${S.club||S.team} ${DPN[S.dpos]}位置的競爭者：${list}。<br>你的綜合 ${mine}，預估角色 <b class="hl">${ROLES[role][0]}</b>。`);
}
/* 覺醒(天才/大器晚成):兩項未滿 70 的能力 +5、潛力上限 +10 */
function awaken(){ const cands=shuffle(GRP_AB[S.grp].filter(k=>S.ab[k]<70)), bl=[];
  cands.slice(0,2).forEach(k=>{ S.pot[k]=Math.min(80,(S.pot[k]||62)+10);
    S.ab[k]=clamp(S.ab[k]+5,1,80); bl.push(`${ABL[k]} <b class="up">+5</b>（潛力上限 +10 → ${S.pot[k]}）`); });
  return bl.length?`潛能重新被評估：${bl.join('、')}。`:''; }
function training(){
  let n=S.skipMid?2:(()=>{const r=R();return r<0.35?3:r<0.75?4:r<0.95?5:6;})();
  if(S.traits.distract&&!S.skipMid)n=Math.max(2,n-1); /* 外務纏身 */
  const dice=[]; let newSix=0;
  for(let i=0;i<n;i++){ const v=S.traits.genius?ri(4,6):S.traits.late?ri(3,6):ri(1,6); dice.push(v);
    if(v===6&&S.age<21&&!S.traits.genius){S.six++;newSix++;} }
  let msg=`自主訓練擲出 <b class="hl">${n}</b> 顆骰。`;
  if(newSix)msg+=` 高標值「6」累計 <b class="hl">${S.six}/5</b> 次。`;
  card('','季前特訓',msg);
  if(S.six>=5&&!S.traits.genius&&S.age<21)
    traitCard('genius','21 歲前五度擲出高標值！從今以後，每一顆訓練骰<b class="hl">永久固定 4 點以上</b>，事件卡好結果機率提升至 <b class="hl">70%</b>。'+awaken());
  /* 大器晚成:25～31 歲、綜合仍未滿 46,單季骰點總和 ≥ 20 */
  const sum=dice.reduce((a,b)=>a+b,0);
  if(!S.traits.late&&!S.traits.genius&&S.age>=25&&S.age<32&&ovr()<46&&sum>=20)
    traitCard('late','別人都以為你到頂了，你卻在這一年脫胎換骨——每一顆訓練骰<b class="hl">永久固定 3 點以上</b>，事件卡好結果機率提升至 <b class="hl">70%</b>。'+awaken());
  choose('',[{t:`▸ 分配訓練成果（${n} 顆骰）`,main:true,f:()=>allocUI({dice},'分配訓練成果（黃字＝目前位置計入綜合的能力）',()=>nextStep())}]);
}

function removeTrait(key){ if(S.traits[key]){ S.traits[key]=false; if(!S.removed.includes(TRAITN[key]))S.removed.push(TRAITN[key]); } }
/* 事件卡、戀愛之後即時檢查的特質 */

/* ---------- 戀愛事件(20 歲起、職業球員) ---------- */
let CHEER=['林曉晴','陳若彤','張沛慈','王詠恩','許昀熙','蘇采蓁','周依潔','郭芷萱']; /* 全虛構人名 */
const CHEER_JOB=['人氣主播','女演員','網紅','女足國腳'];
function loveGainTxt(k,amt){ /* 加點機制同事件卡;超過潛力的部分轉為本季成績加成 */
  const before=S.pendStat, g=addAbStat(k,amt), over=S.pendStat-before;
  if(g>0&&over>0)return `<b class="up">${ABL[k]} +${g}</b>（溢出 ${over} 點轉為本季成績加成）`;
  if(g>0)return `<b class="up">${ABL[k]} +${g}</b>`;
  if(over>0)return `<b class="up">本季成績加成 +${over}</b>（${ABL[k]} 已達潛力上限）`;
  return `${ABL[k]} 能力加點，但不足以提升一級`;
}
function addAbStat(k,amt){
  if(amt<=0)return addAb(k,amt);
  const pk=(S.pot&&S.pot[k])||62; let cur=S.ab[k], bud=amt, cr=S.carry[k]||0, gained=0;
  if(cur>=pk){ S.pendStat+=bud; return 0; }
  while(bud>0&&cur<pk){ bud--; cr++; if(cr>=stepCost(cur)){ cr-=stepCost(cur); cur++; gained++; } }
  S.carry[k]=cr; S.ab[k]=cur; if(bud>0)S.pendStat+=bud;
  return gained;
}
const breakUp=()=>{ const L=S.love; L.st=L.exes.length?'divorced':'single'; L.partner=null; L.dyrs=0; };
function loveEvent(next){
  const L=S.love;
  if(S.stage!=='PRO'||S.age<20){ next(); return; }

  if(L.st==='dating'){
    L.dyrs++; const y=L.dyrs;
    const cheatPen=(L.cheatYr===S.year-1||L.cheatYr===S.year)?30:0;
    const bkP=(y>=4?20+(y-4)*15:0)+cheatPen;
    if(bkP>0&&chance(bkP)){
      const k1=pick(GRP_AB[S.grp]),k2=pick(GRP_AB[S.grp]), g1=addAb(k1,-3),g2=addAb(k2,-3), ex=L.partner; breakUp(); board();
      card('bad','分手',`${cheatPen?'那晚的事她其實都知道。':''}交往 ${y} 年，婚期一延再延。<b class="hl">${ex}</b> 最後留下一句：「我等不到了。」整個夏天你魂不守舍——<b class="dn">${ABL[k1]} ${g1}、${ABL[k2]} ${g2}</b>。`);
      next(); return; }
    const ask=()=>proposalAsk(next);
    if(chance(30)){ const r=R()*100;
      if(r<40){ const t=pick(CHEER.filter(n=>n!==L.partner));
        choose(`慶功宴散場，${t} 說順路想搭你的車`,[
          {t:'讓她上車（賭一把）',warn:true,s:'沒被抓到＝體能提升｜被抓到＝能力下跌、當年分手率 +30%',f:()=>{
            L.affairs++;

            else loveCaught(next,true); }},

      const gt=loveGainTxt('sta',1); board();

      ask(); return; }
    ask(); return;
  }
  const fire=(L.st==='married'&&L.kids===0)?40:(L.st==='single'||L.st==='divorced')?40:30;
  if(!chance(fire)){ next(); return; }

    choose('記者把麥克風遞到你面前：「兩位是在交往嗎？」',[
      {t:'大方承認：「請大家祝福我們」',s:'還要看她那邊願不願意公開',f:()=>{
        if(chance(65)){ L.st='dating'; L.partner=p; L.dyrs=0; L.datedTimes++;
          const gt=loveGainTxt('sta',1); board();
          card('gold','戀情公開',`<b class="hl">${p}</b> 在社群發出十指緊扣的照片：「謝謝大家的祝福。」戀愛使人容光煥發——${gt}。你們正式交往了。`);
          if(L.datedTimes>=3&&L.kids===0&&!S.traits.confidante)
            traitCard('confidante','第三段戀情，還是走到了同樣的結局——有些人註定是別人生命裡的過客。');
        } else card('bad','單方面承認',`她隔天透過經紀公司否認：「只是普通朋友。」你一個人站在風裡，超級尷尬。`);
        next(); }},
      {t:'笑而不答，快步走過',main:true,s:'不承認就沒有下文',f:()=>{ card('info','未完待續','緋聞燒了三天就退燒。也許時機還沒到。'); next(); }}]);
    return;
  }
  /* 已婚:生子 → 外遇誘惑 → 家庭小事 */
  if(L.kids<4&&chance([65,45,30,20][L.kids])){
    L.kids++; const gt=loveGainTxt(pick(GRP_AB[S.grp]),2); board();
    card('gold','新生命',`${L.partner} 平安生下你們的第 <b class="hl">${L.kids}</b> 個孩子。當了爸爸的男人，眼神都不一樣了——${gt}。`);

  const r=R()*100;

      {t:'赴約（賭一把）',warn:true,s:'沒被抓到＝體能提升｜被抓到＝能力下跌、婚姻危機',f:()=>{
        L.affairs++;
        if(chance(55)){ const gt=loveGainTxt('sta',2); board(); card('bad','深夜行程',`你僥倖沒被拍到。不知為何，罪惡感反而讓你精神亢奮——${gt}。（你知道這不會有好下場）`); checkTraitsMid(); next(); }
        else loveCaught(next,false); }},
      {t:'回訊息：「陪小孩講完故事了，晚安」',main:true,s:'家庭和睦，絕對不虧',f:()=>{
        const gt=loveGainTxt('sta',1); board(); card('good','家的方向',`你把手機扣在桌上，撥了視訊回家。${L.partner} 和孩子在鏡頭那頭揮手——${gt}。`); next(); }}]); return; }
  const gt=loveGainTxt('sta',1); board();
  if(r<70&&L.kids>0)card('good','球場邊的父親',`你被拍到賽前在場邊教孩子顛球，影片配文「最強足球教室」瘋傳——${gt}。`);
  else card('good','結婚紀念日',`結婚紀念日，你推掉了加練，陪 <b class="hl">${L.partner}</b> 回到當年辦婚禮的場地。她說：「明年也要來喔。」——${gt}。`);
  next();
}
function proposalAsk(next){
  const L=S.love; if(L.st!=='dating'){ next(); return; }
  choose(`交往第 ${L.dyrs} 年——${L.partner} 看著別人的婚禮影片看了很久`,[
    {t:'就是現在——求婚',s:'體能提升、本季更不容易受傷',f:()=>{
      L.st='married'; L.kids=0; L.dyrs=0; const gt=loveGainTxt('sta',2); S.tmpInj-=5; board();
      card('gold','婚禮',`你在主場中圈單膝跪地，大螢幕打出「Marry Me」。<b class="hl">${L.partner}</b> 哭著點頭——${gt}、本季受傷機率 <b class="up">−5%</b>。`); next(); }},
    {t:'再存一點錢吧',main:true,s:'她沒說什麼，但交往越久分手風險越高',f:()=>{ card('info','再等等','她關掉影片，笑著說沒事。你假裝沒看到她眼裡的東西。'); next(); }}]);
}
/* 外遇/劈腿被抓:第二次起解鎖渣男,之後每次全能力 −5 */
function loveCaught(next,dating){
  const L=S.love; L.caught++; if(dating)L.cheatYr=S.year;
  const kk=pick(GRP_AB[S.grp]), g=addAb(kk,-3); let extra='';
  if(L.caught>=2){
    if(!S.traits.scum)traitCard('scum','第二次被逮個正著，你在球迷心中的形象定型了——<b class="dn">每次被抓到，全能力 −5</b>。','bad');
    GRP_AB[S.grp].forEach(k=>{ S.ab[k]=clamp(S.ab[k]-5,1,80); }); extra='<b class="dn">全能力 −5</b>（渣男的代價）。'; }
  board(); checkTraitsMid();
  card('bad',dating?'劈腿曝光':'頭版醜聞',`${dating?'行車紀錄器畫面流出，時間軸對得整整齊齊。':'狗仔的鏡頭比你想的更快，照片鋪滿版面，贊助商緊急撤圖。'}<b class="dn">${ABL[kk]} ${g}</b>。${extra}`);
  const end=()=>{ const ex=L.partner; if(dating)breakUp(); else { L.exes.push({name:ex,kids:L.kids}); L.st='divorced'; L.partner=null; L.kids=0; } return ex; };
  choose(dating?`${L.partner} 已讀不回三天後，終於答應見面`:`${L.partner} 把離婚協議書放在餐桌上`,[
    {t:'道歉，求她再給一次機會',s:`成功保住${dating?'感情':'婚姻'}｜失敗＝再扣能力並${dating?'分手':'離婚'}`,f:()=>{
      if(chance(40)){ card('info','低谷之後',`她最後說：「最後一次。」${dating?'感情':'婚姻'}保住了，但有些東西回不去了。`); next(); }
      else { const k2=pick(GRP_AB[S.grp]), g2=addAb(k2,-2), ex=end(); board();
        card('bad','道歉無效',`<b class="hl">${ex}</b> ${dating?'封鎖了所有聯絡方式':'的律師隔天寄來存證信函'}——<b class="dn">${ABL[k2]} ${g2}</b>。`); next(); } }},
    {t:dating?'坦然分手':'簽字離婚',f:()=>{ const ex=end(); card('bad',dating?'分手':'離婚',`<b class="hl">${ex}</b> 的聲明只有一句：「祝彼此安好。」`); next(); }}]);
}

/* ---------- 賽季中 ---------- */
function phaseMid(){
  board(1);
  if(S.skipMid){ logSeason({App:0,Min:0,G:0,A:0,Rt:0,CS:0,GA:0,role:'—',d:0},'復健年・全年報銷',true); nextStep(); return; }
  loveEvent(()=>drawEvents(S.stage==='PRO'?3:2,()=>winterWindow(()=>{
    choose('',[{t:'▸ 季中健康檢查',main:true,f:()=>{ rollInjury();
      choose('',[{t:'▸ 查看賽季表現',main:true,f:seasonResult}]); }}]);
  })));
}
function evOdds(){ /* 事件卡成功率:顯示與擲骰共用同一來源 */
  let base=(S.traits.genius||S.traits.late||S.traits.clutch)?70:50;
  if(S.traits.yips)base-=10; /* 點球恐懼症 */
  return {safe:Math.min(95,base+20), norm:base, bold:base-(S.traits.clutch?0:15)}; /* 大心臟:豪賭無懲罰 */
}
function drawEvents(n,done){
  if(n<=0){ done(); return; }
  choose('',[{t:`抽事件卡（剩 ${n} 張）`,main:true,f:()=>{
    const pool=EVENTS.filter(e=>e.for==='*'||(e.for==='GK'&&isGK())||(e.for==='OUT'&&!isGK())||(e.for==='PRO'&&S.stage==='PRO'));
    const ev=pick(pool), od=evOdds();
    const after=()=>{ board(1); drawEvents(n-1,done); };
    choose(`事件｜${ev.n} — 你要怎麼應對？`,[
      {t:'全力一搏',warn:true,s:`成功率 ${od.bold}%｜加成／減益幅度最大（±3）`,f:()=>resolveEvent(ev,'bold',after)},
      {t:'照常執行',main:true,s:`成功率 ${od.norm}%｜標準幅度（±2）`,f:()=>resolveEvent(ev,'norm',after)},
      {t:'保守應對',s:`成功率 ${od.safe}%｜加成／減益幅度最小（±1）`,f:()=>resolveEvent(ev,'safe',after)}]);
  }}]);
}
function resolveEvent(ev,mode,done){
  const od=evOdds(), good=chance(od[mode]);
  const tag=mode==='safe'?'保守應對':mode==='bold'?'全力一搏':'';
  let mag=mode==='safe'?1:mode==='bold'?3:2;
  if(mode==='bold'&&S.traits.clutch)mag=good?4:2; /* 大心臟:上檔更高、下檔更軟 */
  if(mode==='safe'&&good)S.cntSaveWin++;
  if(mode==='bold'){ if(good)S.cntBoldWin++; else S.cntBoldFail++; }
  if(ev.n==='商業代言'&&mode!=='safe'&&!good)S.cntEndorseFail++;
  if(ev.n==='定位球練習'&&good&&++S.setPieceWin>=4&&S.ab.pas>=55&&!S.traits.setpiece)
    S.pendTrait='setpiece'; /* 卡片顯示後再解鎖,避免順序錯亂 */
  const fx=good?ev.g:ev.b, out=[]; let touched=false;
  const applyAbil=(k,dir)=>{ touched=true;
    if(dir<0){ out.push(`${ABL[k]} <span class="dn">${addAb(k,-mag)}</span>`); return; }
    /* 加點吃量表成本,超過潛力上限的部分轉為本季成績加成 */
    const pk=(S.pot&&S.pot[k])||62; let cur=S.ab[k], bud=mag, cr=S.carry[k]||0, gained=0;
    while(bud>0&&cur<pk){ bud--; cr++; if(cr>=stepCost(cur)){ cr-=stepCost(cur); cur++; gained++; } }
    S.carry[k]=cr; S.ab[k]=cur;
    if(gained>0)out.push(`${ABL[k]} <span class="up">+${gained}</span>`);
    else if(bud<=0)out.push(`${ABL[k]}：能力加點，但不足以提升一級`);
    if(bud>0){ S.pendStat+=bud; out.push(`<span class="up">狀態火燙（本季成績加成 ×${bud}）</span>`); }
  };
  for(const k in fx){ const dir=fx[k]>0?1:-1;
    if(k==='inj'){ const v=({1:8,2:12,3:16})[mag]; S.tmpInj+=v; out.push(`本季受傷機率 <span class="dn">+${v}%</span>`); touched=true; }
    else if(k==='role'){ S.roleAdj+=dir; out.push(dir>0?'<span class="up">上場地位 +1</span>':'<span class="dn">上場地位 −1</span>'); touched=true; }
    else if(k==='pay'){ const p=Math.round(LV[S.lv].sal*0.1*mag); S.salary+=p; out.push(`代言收入 <span class="up">+${fmtMoney(p)}</span>`); touched=true; }
    else if(k==='rand')applyAbil(pick(GRP_AB[S.grp]),dir);
    else if(k in S.ab)applyAbil(k,dir); }
  if(!touched)applyAbil(pick(GRP_AB[S.grp]),good?1:-1);
  card(good?'good':'bad','事件卡｜'+ev.n+(tag?`（${tag}）`:''),
    `${good?ev.gt:ev.bt}。${mode==='bold'&&good?'<b class="hl">豪賭成功！</b>':''}${mode==='bold'&&!good?'<b class="dn">豪賭失敗……</b>':''}<br>${out.join('｜')}`);
  if(S.pendTrait==='setpiece'){ S.pendTrait=null;
    traitCard('setpiece','角球、自由球，只要球停在地上，就是你的時間——<b class="hl">每季額外貢獻定位球進球與助攻</b>。'); }
  checkTraitsMid();
  done();
}
function injuryProb(){
  let p=12+S.tmpInj-(S.ab.sta-40)*0.1;
  if(!isGK())p-=(S.ab.phy-40)*0.15;
  if(S.age>=30)p+=(S.age-29)*1.5;
  if(S.traits.iron)p=Math.min(p,10);  /* 鐵人 */
  if(S.traits.glass)p=Math.max(p,35); /* 玻璃人 */
  return clamp(p,3,60);
}
function rollInjury(){
  if(!chance(injuryProb())){ card('good','健康檢查','身體狀況良好，整季沒有傷停。'); return; }
  if(chance(15)){ S.seasonFactor*=0.5; S.bigInj++;
    if(chance(30)){ S.rehab=1; card('bad','重傷','韌帶斷裂，本季後半報銷，<b class="dn">下季也要全年復健</b>。'); }
    else card('bad','重傷','肌腱撕裂，缺席<b class="dn">半個賽季</b>。');
    /* 32 歲前第二次大傷才定性為玻璃體質;之後算老化 */
    if(S.bigInj>=2&&!S.traits.glass&&!S.traits.phoenix&&S.age<32)
      traitCard('glass','生涯第二次大傷。從此傷病如影隨形，未來每季受傷機率<b class="dn">不低於 35%</b>。','bad');
    return; }
  const w=ri(2,8); S.seasonFactor*=clamp(1-w*0.025,0.8,0.95);
  card('bad','小傷',`肌肉拉傷，缺席 <b class="dn">${w} 週</b>。`);
}
/* 上場地位:[名稱, 出場比例下限, 上限, 平均分鐘下限, 上限] */
const ROLES=[['主力',.80,1.0,80,90],['輪替',.53,.79,55,75],['替補',.26,.58,20,40],['板凳',0,.26,10,25]];
/* 與最強競爭者比較定角色;事件／拒絕轉位修正;季中狀態火燙可升一級 */
function seasonRole(){
  let r=clamp(roleOf(ovr()-rivalTop())-S.roleAdj,0,3); S.roleAdj=0;
  if(r>0&&(S.pendStat>=3||(ovr()-curPar()>=5&&chance(40)))){ r--;
    card('good','季中逆襲',`狀態火燙，教練把你拉上更重要的角色：<b class="up">${ROLES[r][0]}</b>。`); }
  return r;
}
function simSeason(par,games,r){
  const d=ovr()-par, f=S.seasonFactor;
  const [rn,a,b,m1,m2]=ROLES[r];
  const app=Math.round(games*(a+R()*(b-a))*f);
  let mpg=ri(m1,m2);
  if(isGK())mpg=r<=1?90:mpg; else if(S.ab.sta<45)mpg=Math.round(mpg*0.85);
  const min=app*mpg, n90=min/90;
  const st={App:app,Min:min,G:0,A:0,Rt:0,CS:0,GA:0,role:rn,d};
  const pend=S.pendStat; S.pendStat=0; const boost=1+pend*0.03;
  const dp=S.dpos;
  if(isGK()){
    st.GA=Math.round(clamp(1.3-d*0.025+N0(0.1),0.5,2.2)*n90);
    st.CS=Math.round(app*(min/Math.max(1,app*90))*clamp(0.28+d*0.012,0.05,0.6));
  } else {
    /* 能力修正封頂 ×1.8、保底 ×0.3,避免高能力在低級別聯賽刷出離譜數據 */
    const gr=GOAL_BASE[dp]*clamp(1+(S.ab.sho-par)*0.035,0.3,1.8)*(dp==='CB'?clamp(1+(S.ab.hea-par)*0.03,0.5,1.6):1);
    const ar=AST_BASE[dp]*clamp(1+(S.ab.pas+S.ab.vis-2*par)*0.02,0.3,1.8);
    const gm=S.traits.goal?1.2:1, am=S.traits.goal?0.8:1, sp=S.traits.setpiece?n90:0; /* 進球機器;定位球專家每 90 分鐘 +0.04 球、+0.05 助攻 */
    st.G=Math.round((Math.max(0,gr)*n90*boost*gm+sp*0.04)*(0.85+R()*0.3));
    st.A=Math.round((Math.max(0,ar)*n90*boost*am+sp*0.05)*(0.85+R()*0.3));
    if(['CB','FB','DM'].includes(dp))st.CS=Math.round(app*clamp(0.25+d*0.01,0.05,0.5));
  }
  const ga=app>0?(st.G+st.A*0.6)/app*0.8:0;
  st.Rt=app>0?+clamp(6.5+clamp(d,-15,15)*0.04+ga+pend*0.02-(S.traits.yips?0.2:0)+N0(0.15),5.5,9.0).toFixed(2):0; /* d 的影響封頂,避免碾壓低級別時評分灌水 */
  return st;
}
function statLine(st){
  const base=`出場 ${st.App}｜${st.role}｜${st.Min} 分鐘`;
  if(isGK())return `${base}｜失球 ${st.GA}｜零封 ${st.CS}｜評分 ${st.Rt||'—'}`;
  return `${base}｜進球 ${st.G}｜助攻 ${st.A}${st.CS?`｜零封 ${st.CS}`:''}｜評分 ${st.Rt||'—'}`;
}
function logSeason(st,line,inj){
  S.log.push({y:S.year,age:S.age,tm:S.stage==='YOUTH'?S.team:S.club+(S.loan?'（租）':''),loan:!!S.loan,lv:S.lv,dp:S.dpos,st,line,inj:!!inj});
  if(S.stage==='PRO'){ const b=S.stats[S.lv]||(S.stats[S.lv]={yr:0,App:0,Min:0,G:0,A:0,CS:0,GA:0});
    b.yr++; ['App','Min','G','A','CS','GA'].forEach(k=>b[k]+=st[k]); }
}
function seasonResult(){
  const youth=S.stage==='YOUTH';
  const r=seasonRole();
  const st=youth?simSeason(YOUTH_PAR[S.youthTier],20,r):simSeason(LV[S.lv].par,LV[S.lv].g,r);
  S.lastD=st.d; S.lastSt=st;
  if(!youth&&ovr()>=(S.peakOvr||0)){ S.peakOvr=ovr(); S.peakType=playerType(); } /* 結算圖顯示巔峰時期的類型 */
  logSeason(st,statLine(st));
  if(!youth){ if(S.seasonFactor>=0.95&&st.App>=LV[S.lv].g*0.8){ if(++S.ironStreak>=7&&!S.traits.iron)traitCard('iron','連續七年全勤級出賽！鋼鐵般的身體，未來每季受傷機率<b class="hl">不高於 10%</b>。'); }
    else if(S.seasonFactor<0.95)S.ironStreak=0; }
  card('info',youth?'青年聯賽成績':`${LV[S.lv].n}成績`,`<div class="statline">${statLine(st)}</div>`);
  leagueAwards(st);
  board(1); nextStep();
}
/* ---------- 個人獎項 ---------- */
/* 聯賽獎項:門檻依輪數換算成 38 輪基準;達標後再擲骰(同季有其他候選人) */
function leagueAwards(st){
  if(S.stage!=='PRO'||!st.App)return;
  const L=LV[S.lv], g38=L.g/38, Y=seasonLabel(S.year), main=st.role==='主力', got=[];
  const add=n=>{ S.honors.push(`${Y} ${L.n}${n}`); got.push(n); };
  if(!isGK()){ const th=Math.round((L.eu?22:18)*g38); if(st.G>=th&&chance(55+(st.G-th)*8))add('金靴'); }
  else if(main&&st.CS>=Math.round(14*g38)&&chance(50))add('金手套');
  if(main&&st.Rt>=7.6&&chance(40+(st.Rt-7.6)*100))add('最佳球員');
  else if(S.age<=23&&st.Rt>=7.2&&chance(50))add('最佳年輕球員');
  if(main&&st.Rt>=7.3&&chance(45))add('年度最佳陣容');
  if(got.length)card('gold','個人獎項',`${L.n}：${got.map(x=>`<b class="hl">${x}</b>`).join('、')}`);
  awardTraits(got);
}
/* 拿到聯賽獎項時的特質:兩度金靴解鎖進球機器;玻璃人拿大獎浴火重生;點球恐懼症痊癒 */
function awardTraits(got){
  if(!got.length)return;
  if(got.includes('金靴')&&++S.bootCount>=2&&!S.traits.goal)
    traitCard('goal','第二座金靴。你的腦子裡只有一件事——<b class="hl">進球率 ×1.2，但助攻 ×0.8</b>。');
  if(S.traits.glass&&got.some(x=>/最佳球員|金靴|金手套/.test(x))){ removeTrait('glass'); S.pool+=8;
    traitCard('phoenix','那些殺不死你的，真的讓你更強大了——<b class="hl">玻璃人解除，受傷率恢復正常，並獲得 8 點能力點</b>。'); }
  if(S.traits.yips){ removeTrait('yips'); card('good','走出陰影','拿下獎項的那一刻，腦海裡的雜音消失了——<b class="hl">點球恐懼症痊癒</b>。'); }
}
/* 年度獎項(季末,冠軍結果出爐後):亞洲足球先生、金球獎 */
function yearAwards(){
  const st=S.lastSt; if(S.stage!=='PRO'||!st||!st.App||st.role!=='主力')return;
  const L=LV[S.lv], champ=S.champYear===S.year;
  const score=st.Rt+(L.top5?0.6:L.eu?0.3:0)+(champ?0.2:0)+(S.ntOn?0.1:0);
  if(score>=7.9&&chance(35+(score-7.9)*60)){ S.honors.push(`${S.year+1} 亞洲足球先生`);
    card('gold','亞洲足球先生',`你被選為 <b class="hl">${S.year+1} 年亞洲足球先生</b>！`); }
  if(L.top5&&champ&&st.Rt>=8.0&&chance(15)){ S.honors.push(`${S.year+1} 金球獎`);
    card('gold','金球獎',`不可思議——你拿下了 <b class="hl">${S.year+1} 年金球獎</b>，世界足壇的最高個人榮譽。`); }
}

/* ---------- 季末 ---------- */
function phaseEnd(){
  board(2);
  if(S.stage==='PRO'){
    /* 薪水由合約所屬聯賽計算(租借期間仍由母隊支付) */
    let sal=S.ct.mil?30:salaryFor(S.ct.lv,ovr()-LV[S.ct.lv].par,S.ct.mult); if(S.seasonFactor===0)sal=Math.round(sal*0.5); /* 服役只領軍餉 */
    S.salary+=sal; S.ct.yrs--;
    card('','季末結算',`本季薪資：<b class="hl">${fmtMoney(sal)}</b>（生涯累計 ${fmtMoney(Math.round(S.salary))}）｜合約剩 ${S.ct.yrs} 年｜身價約 <b class="hl">${fmtMoney(marketValue())}</b>`);
    teamStanding(); yearAwards(); board(2);
    if(!S.loan&&!S.ct.mil){ S.clubYrs[S.club]=(S.clubYrs[S.club]||0)+1;
      if(S.clubYrs[S.club]>=8&&!S.traits.franchise)traitCard('franchise',`在 ${S.club} 效力滿八季，你已是這支球隊的象徵——<b class="hl">母隊續約年薪 ≥×1.2、多給 1 年</b>。`); }
  }
  /* 國家隊 → 國際賽能力點 → 兵役 → 歸化 → 轉會 */
  const go=()=>militaryCheck(()=>naturalCheck(movement));
  natCall(()=>{
    if(S.pool>0){ const p=S.pool; S.pool=0;
      choose('',[{t:`▸ 分配能力點（${p} 點・國際賽成果）`,main:true,f:()=>allocUI({pool:p},'季末能力點分配（國際賽成果）',go)}]); }
    else go(); });
}
/* 球隊戰績:依檔次擲奪冠、升級、降級;租借期間只記冠軍 */
function teamStanding(){
  const L=LV[S.lv], t=S.clubTier;
  if(chance({1:30,2:5,3:0.5}[t]*(S.traits.clutch?1.25:1))){
    S.honors.push(`${seasonLabel(S.year)} ${L.n}冠軍（${S.club}）`); S.champYear=S.year;
    card('gold','聯賽冠軍',`${S.club}奪下 <b class="hl">${L.n}冠軍</b>！`);
    if(L.up&&!S.loan&&!S.ct.mil)promote();
    return; }
  if(S.loan||S.ct.mil)return; /* 租借、服役期間不影響母隊升降 */
  if(L.up&&chance({1:45,2:12,3:2}[t])){ promote(); return; }
  if(L.rel&&chance({1:0,2:8,3:35}[t]))relegate();
}
function promote(){
  S.lv=LV[S.lv].up; S.clubTier=3;
  if(S.relegated){ S.ct.mult/=0.6; S.relegated=false; } /* 重返頂級,降級條款解除 */
  card('gold','升級！',`${S.club}升上 <b class="hl">${LV[S.lv].n}</b>，下季在頂級聯賽作戰（球隊檔次：保級）。`);
}
function relegate(){
  S.lv=LV[S.lv].rel; S.clubTier=1; S.ct.mult*=0.6; S.relegated=true;
  card('bad','降級',`${S.club}降至 <b class="dn">${LV[S.lv].n}</b>，降級條款生效：年薪打 6 折。夏窗可能有上級球隊來挖角。`);
}
/* 身價 = 聯賽基準 × OVR 係數 × 年齡係數 × 合約剩餘係數 × 位置倍率 */
function marketValue(){
  if(S.stage!=='PRO')return 0;
  const ageF=S.age<=20?1.1:S.age<=25?1.3:S.age<=29?1.0:Math.pow(0.85,S.age-29);
  const ctF=S.ct.yrs>=2?1:S.ct.yrs===1?0.5:0;
  return Math.round(LV[S.lv].sal*3*clamp(1+(ovr()-LV[S.lv].par)*0.08,0.3,3)*ageF*ctF*DP_MULT[S.dpos]);
}
function movement(){
  if(S.stage==='YOUTH'){ if(S.stageYr<3)advance(); else youthExit(); return; }
  if(S.mil==='serving'){ if(endService())summerWindow(); else contractEnd(); return; }
  if(S.loan)endLoan();
  if(S.ct.yrs>0)summerWindow(); else contractEnd();
}
const retireOpt=msg=>({t:'召開引退記者會',warn:true,f:()=>endGame(msg||`功成身退，於 ${S.year+1} 年夏天宣布引退。`)});
const lastRoleIdx=()=>{ const r=S.log.length?S.log[S.log.length-1].st.role:'主力', i=ROLES.findIndex(x=>x[0]===r); return i<0?2:i; };

/* ---------- 合約與報價 ---------- */
function tierOf(lv,club){ const a=TEAMS[lv], i=a.indexOf(club), n=a.length; return i<0?2:i<n/4?1:i>=n*3/4?3:2; }
const ctYears=()=>S.age>=32?ri(1,2):ri(2,4);
/* 從聯賽挑 n 支球隊報價;豪門只找綜合 ≥ par+2 的人 */
function makeOffers(lv,n,ex){
  const o=ovr(), par=LV[lv].par;
  const cands=TEAMS[lv].filter(t=>t!==ex&&!(tierOf(lv,t)===1&&o<par+2));
  return shuffle(cands).slice(0,n).map(club=>({lv,club,tier:tierOf(lv,club),yrs:ctYears()}));
}
/* 對你有興趣的聯賽(par 高到低):過簽約門檻;往上跳需達該聯賽 par−1;工作證;首次登陸歐洲需 par+球探打折 且未滿 30 歲 */
function leagueCands(allowDown){
  const o=ovr(), cur=S.lv?LV[S.lv].par:0, inEU=!!(S.lv&&LV[S.lv].eu), N=NATS[S.nat];
  return Object.keys(LV).filter(k=>{ const L=LV[k];
    if(L.local&&!N.home.includes(k))return false; /* 小聯賽只簽本國球員 */
    if(o<L.min)return false;
    if(L.wp&&N.wp&&o<L.par+3-(S.caps>=30?2:S.caps>=10?1:0))return false; /* 工作證:國家隊出賽多可降門檻 */
    if(L.par>cur&&o<L.par-1)return false;
    if(L.eu&&!inEU&&(S.age>=30||o<L.par+N.scout))return false;
    if(L.top5&&!(S.lv&&LV[S.lv].top5)&&o<L.par+N.scout)return false; /* 首次進五大:依國籍球探打折(弱國 +2、中 +1、強國 0) */
    if(!allowDown&&L.par<cur)return false;
    return true; }).sort((a,b)=>LV[b].par-LV[a].par);
}
/* 報價多集中在最高的三個聯賽 */
function genOffers(n,allowDown){
  const ls=leagueCands(allowDown), out=[], used=new Set([S.club]);
  if(!ls.length)return out;
  const top=ls.slice(0,3);
  for(let i=0;i<n*4&&out.length<n;i++){
    const of=makeOffers(pick(R()<0.7?top:ls),1)[0];
    if(of&&!used.has(of.club)){ used.add(of.club); out.push(of); } }
  return out;
}
/* 報價數:上季評分越高越多;自由球員 +1、申請轉會 +1 */
function offerCount(fa){
  const last=S.log[S.log.length-1], rt=last?last.st.Rt:0;
  return (rt>=7.3?ri(2,3):rt>=6.9?ri(1,2):ri(0,1))+(fa?1:0)+(S.wantOut?1:0);
}
const ofName=of=>`${of.club}（${LV[of.lv].n}・${TIERN[of.tier]}）`;
function offerOpt(of,main,title){
  const est=salaryFor(of.lv,ovr()-LV[of.lv].par,TIER_PAY[of.tier]);
  return {t:title||ofName(of),main,
    s:`${of.yrs} 年｜年薪約 ${fmtMoney(est)}｜${TIER_DESC[of.tier]}`,f:()=>{ signTo(of); advance(); }};
}
function signTo(of){
  if(of.club!==S.club)S.rivals=[]; /* 換隊就換一批競爭者 */
  S.stage='PRO'; S.lv=of.lv; S.club=of.club; S.clubTier=of.tier; S.loan=null;
  S.ct={yrs:of.yrs,mult:TIER_PAY[of.tier],lv:of.lv}; S.wantOut=false; S.relegated=false;
  card('gold','簽約',`與 <b class="hl">${of.club}</b>（${LV[of.lv].n}・${TIERN[of.tier]}）簽下 <b class="hl">${of.yrs} 年</b>合約。`);
  board(2);
}
function youthExit(){
  const o=ovr(), potAvg=GRP_AB[S.grp].reduce((s,k)=>s+S.pot[k],0)/GRP_AB[S.grp].length;
  card('info','球探評估',`青訓三年結束，綜合能力 <b class="hl">${o}</b>。`);
  /* 本土低級別 2 份;能力夠就加本土頂級;本土聯賽弱的國家,能力夠可直接赴日韓次級 */
  const offers=makeOffers(homeLow(),2), top=homeTop();
  if(top!==homeLow()&&o>=LV[top].min)offers.push(...makeOffers(top,1));
  if(LV[homeLow()].par<40&&o>=38)offers.push(...makeOffers(pick(['J2','K2']),o>=42?2:1));
  const opts=offers.map((of,i)=>offerOpt(of,i===0));
  /* 歐洲青訓試訓:潛力夠高才有機會;失敗只能晚一步回國簽短約 */
  if(potAvg>=60){ const p=clamp(Math.round(25+(potAvg-60)*4+(S.traits.genius?20:0)),10,70);
    opts.push({t:'赴歐青訓試訓',warn:true,s:`成功率 ${p}%｜成功直接簽歐洲球隊；失敗只能回國簽 1 年短約`,f:()=>{
      if(chance(p)){ const lv=pick(['NED','POR','BEL']), club=pick(TEAMS[lv].filter(t=>tierOf(lv,t)>=2));
        card('gold','試訓成功',`${club}的青訓總監看中你的潛力，開出一份長約。`);
        signTo({lv,club,tier:tierOf(lv,club),yrs:4}); }
      else { card('bad','試訓失敗','在歐洲待了兩個月，最後沒拿到合約。回國時本土球隊早已補滿名單。');
        signTo({...makeOffers(homeLow(),1)[0],yrs:1}); S.roleAdj--; }
      advance(); }}); }
  choose('18 歲的十字路口',opts);
}
/* 夏窗:合約內的轉會、租借、申請轉會、被動出售 */
function summerWindow(){
  const lastRole=lastRoleIdx(), mv=marketValue();
  /* 被動出售:球隊收到報價想賣人;拒絕則下季上場地位 −1 */
  if(lastRole<=1&&chance((S.clubTier===3?20:12)+(S.traits.cancer?20:0))){ const b=genOffers(1,false)[0];
    if(b){ choose(`${S.club}接受了 ${b.club} 的報價`,[
      {t:`同意轉會至 ${ofName(b)}`,main:true,s:`${b.yrs} 年｜${TIER_DESC[b.tier]}`,f:()=>{ card('good','轉會',`${S.club}以約 ${fmtMoney(mv)} 的價格把你賣給 ${b.club}。`); signTo(b); advance(); }},
      {t:'拒絕，留在隊上',warn:true,s:'球團不太高興，下季上場地位 −1',f:()=>{ S.roleAdj--; card('bad','拒絕轉會','你拒絕離開，但球團的態度明顯冷淡了。'); advance(); }}]);
      return; } }
  const offers=genOffers(offerCount(false),lastRole>=2);
  /* 降級條款:上級聯賽球隊來挖角 */
  if(S.relegated){ const up=Object.keys(LV).find(k=>LV[k].rel===S.lv), of=up&&ovr()>=LV[up].min&&makeOffers(up,1,S.club)[0];
    if(of&&!offers.some(x=>x.club===of.club))offers.unshift(of); }
  const opts=[{t:'▸ 留隊，進入下一季',main:true,f:advance}];
  offers.forEach(of=>{ const fee=Math.round(mv*(0.9+R()*0.3));
    opts.push({t:`轉會：${ofName(of)}`,s:`${of.yrs} 年｜轉會費約 ${fmtMoney(fee)}｜${TIER_DESC[of.tier]}`,f:()=>{
      /* 合約剩 2 年以上的主力,球隊可能拒絕放人;申請轉會後比較願意放 */
      if(lastRole===0&&S.ct.yrs>=2&&chance(S.wantOut?20:50)){
        card('bad','球隊拒絕放人',`${S.club}認為你是核心戰力，拒絕了 ${of.club} 的報價。`); advance(); return; }
      card('good','轉會成功',`${of.club}支付約 ${fmtMoney(fee)} 轉會費，把你帶走。`); signTo(of); advance(); }}); });
  if(S.age<=23&&lastRole>=2){ const lo=loanOffer();
    if(lo)opts.push({t:`租借：${ofName(lo)}`,s:'為期一季，累積上場時間後歸隊',f:()=>{ startLoan(lo); advance(); }}); }
  if(!S.wantOut)opts.push({t:'申請轉會',warn:true,s:'下次報價變多、球隊比較願意放人；但下季上場地位 −1',f:()=>{
    S.wantOut=true; S.roleAdj--; card('bad','申請轉會','你向球團表達想離隊的意願，更衣室氣氛變得微妙。'); advance(); }});
  if(S.age>=30)opts.push(retireOpt());
  choose(`夏季轉會窗 · 合約剩 ${S.ct.yrs} 年 · 身價約 ${fmtMoney(mv)}`,opts);
}
/* 冬窗:預估角色為替補/板凳才有人找;23 歲以下可租借 */
function winterWindow(cont){
  if(S.stage!=='PRO'||S.loan){ cont(); return; }
  const role=clamp(roleOf(ovr()-rivalTop())-S.roleAdj,0,3);
  if(role<2){ cont(); return; }
  const opts=[{t:'留隊爭取機會',main:true,f:cont}];
  if(S.age<=23){ const lo=loanOffer();
    if(lo)opts.push({t:`冬窗租借：${ofName(lo)}`,s:'下半季去累積上場時間',f:()=>{ startLoan(lo); fillRivals(); cont(); }}); }
  const of=genOffers(1,true)[0];
  if(of)opts.push({t:`冬窗轉會：${ofName(of)}`,s:`${of.yrs} 年｜${TIER_DESC[of.tier]}`,f:()=>{ signTo(of); fillRivals(); cont(); }});
  if(opts.length===1){ cont(); return; }
  choose(`冬季轉會窗 · 上場時間不足（預估${ROLES[role][0]}）`,opts);
}
/* 租借:去低 3～12 par 的聯賽,只找中游/保級球隊 */
function loanOffer(){
  const P=LV[S.lv].par, o=ovr();
  const ls=Object.keys(LV).filter(k=>{ const L=LV[k]; return L.par<=P-3&&L.par>=P-12&&o>=L.min&&!(L.wp&&NATS[S.nat].wp&&o<L.par+3)&&!(L.local&&!NATS[S.nat].home.includes(k)); });
  if(!ls.length)return null;
  const lv=pick(ls), club=pick(TEAMS[lv].filter(t=>tierOf(lv,t)>=2));
  return {lv,club,tier:tierOf(lv,club),yrs:1};
}
function startLoan(of){
  S.loan={lv:S.lv,club:S.club,tier:S.clubTier,rivals:S.rivals};
  S.lv=of.lv; S.club=of.club; S.clubTier=of.tier; S.rivals=[];
  card('info','租借',`租借至 <b class="hl">${of.club}</b>（${LV[of.lv].n}・${TIERN[of.tier]}），為期一季。薪水仍由母隊支付。`);
  board(2);
}
function endLoan(){
  const L=S.loan; S.loan=null;
  S.lv=L.lv; S.club=L.club; S.clubTier=L.tier; S.rivals=L.rivals;
  const grew=ovr()>=curPar();
  if(grew)S.roleAdj++;
  card('info','租借歸隊',`回到 ${S.club}。${grew?'租借期間進步明顯，教練準備給你更多機會（下季上場地位 +1）。':'還需要時間證明自己。'}`);
  board(2);
}
function contractEnd(){
  const o=ovr(), opts=[];
  if(o>=LV[S.lv].min){ const re={lv:S.lv,club:S.club,tier:S.clubTier,yrs:S.traits.cancer?1:ctYears()+(S.traits.franchise?1:0)};
    const op=offerOpt(re,false,`與${S.club}續約`);
    if(S.traits.franchise){ op.s+='｜球隊之子：年薪 ×1.2'; op.f=()=>{ signTo(re); S.ct.mult=Math.max(S.ct.mult,1.2); advance(); }; }
    opts.push(op); }
  const offers=genOffers(offerCount(true),true);
  offers.forEach(of=>opts.push(offerOpt(of,false)));
  /* 30 歲後永遠有本土頂級聯賽的返鄉報價 */
  const home=NATS[S.nat].home;
  if(S.age>=30&&!home.includes(S.lv)&&!offers.some(x=>home.includes(x.lv))){ const h=makeOffers(homeTop(),1)[0]; opts.push(offerOpt(h,false,`返鄉：${ofName(h)}`)); }
  if(!opts.length&&S.age<30&&o>=LV[homeLow()].min)opts.push(offerOpt({...makeOffers(homeLow(),1)[0],yrs:1},false));
  if(opts.length)opts[0].main=true;
  if(S.age>=30||!opts.length)opts.push(retireOpt(`合約到期，於 ${S.year+1} 年夏天宣布引退。`));
  choose(`自由球員 · 綜合能力 ${o}`,opts);
}

/* ================= 國家隊與國際賽 ================= */
/* 每季季末處理「下一個日曆年」的賽事:世界盃 2030 起每 4 年、亞運同年;亞洲盃 2027 起;奧運 2028 起 */
const T_WC={n:'世界盃',st:['小組賽','32 強','16 強','8 強','4 強','決賽'],g:[.8,.65,.5,.35,.25],k:[.5,.42,.35,.25,.18]};
const T_AC={n:'亞洲盃',st:['小組賽','16 強','8 強','4 強','決賽'],g:[.95,.85,.65,.45,.3],k:[.65,.55,.4,.3,.2]};
const T_AG={n:'亞運',st:['小組賽','16 強','8 強','4 強','決賽'],g:[.92,.8,.6,.45,.3],k:[.75,.55,.4,.3,.2],u23:1};
const T_OLY={n:'奧運',st:['小組賽','8 強','4 強','決賽'],g:[.55,.5,.45,.4,.35],k:[.4,.38,.35,.3,.25],u23:1};
const ntBonus=()=>clamp((ovr()-NATS[S.nat].nt)*0.005,0,0.1);
/* 世界盃出線率 = 國家基準 + min(上限, max(0, OVR−50)×0.8);只有國家隊主力才算個人加成 */
function wcQualRate(){ const N=NATS[S.nat]; return clamp(N.wc+(S.ntOn?Math.min(N.cap,Math.max(0,ovr()-50)*0.8):0),0,98); }
function natCall(cont){
  const N=NATS[S.nat], was=S.ntOn;
  S.ntOn=S.stage==='PRO'&&ovr()>=N.nt+ri(-2,2);
  if(S.ntOn){ const a=ri(3,6), q=ri(1,3), g=isGK()?0:Math.round(a*GOAL_BASE[S.dpos]*0.7*(0.6+R()*0.8));
    S.caps+=a; S.compCaps+=q; S.intlG+=g;
    card('info',was?'國家隊':'首次入選國家隊',`${was?'':'<b class="hl">夢想成真！</b>'}代表${N.n}出賽 ${a} 場（含資格賽 ${q} 場）${g?`，進 ${g} 球`:''}。國家隊生涯 ${S.caps} 場。`); }
  else if(was)card('bad','落選國家隊',`本季沒有入選${N.n}國家隊名單。`);
  intlYear(S.year+1,cont);
}
function intlYear(Y,cont){
  const N=NATS[S.nat], q=[];
  if(Y>=2030&&Y%4===2)q.push(()=>wcCycle(Y,next));
  if(Y>=2027&&Y%4===3)q.push(()=>acCycle(Y,next));
  if(Y>=2026&&Y%4===2)q.push(()=>u23Cycle(T_AG,Y,true,next));
  if(Y>=2028&&Y%4===0)q.push(()=>u23Cycle(T_OLY,Y,false,next));
  function next(){ const f=q.shift(); if(f)f(); else cont(); }
  next();
}
function wcCycle(Y,next){
  const N=NATS[S.nat], p=Math.round(wcQualRate());
  if(!chance(p)){ card('bad',`${Y} 世界盃資格賽`,`${N.n}在資格賽出局（出線率 ${p}%）。`); next(); return; }
  if(!S.ntOn){ card('info',`${Y} 世界盃`,`${N.n}打進世界盃（出線率 ${p}%），但你不在名單上。`); next(); return; }
  card('gold',`${Y} 世界盃資格賽`,`${N.n}拿到世界盃門票！（出線率 ${p}%）${N.tier>=4?'<br>這是國家足球史上最重要的一刻。':''}`);
  playTourney(T_WC,Y,true); S.pool+=1; next();
}
function acCycle(Y,next){
  const N=NATS[S.nat], p=N.tier>=5?Math.round(25+ntBonus()*100):N.tier>=4?Math.round(60+ntBonus()*100):100; /* 弱國要打會外賽 */
  if(!chance(p)){ card('bad',`${Y} 亞洲盃`,`${N.n}沒能從會外賽突圍（晉級率 ${p}%）。`); next(); return; }
  if(!S.ntOn){ next(); return; }
  playTourney(T_AC,Y,true); next();
}
/* U23 賽事:23 歲以下且達門檻 −4,或國家隊核心以超齡名額入選;韓國未免役球員爭取超齡意願高 */
function u23Cycle(T,Y,isAG,next){
  const N=NATS[S.nat], u23=S.age+1<=23;
  if(S.stage!=='PRO'){ next(); return; }
  const pick23=u23?ovr()>=N.nt-4:(S.ntOn&&ovr()>=N.nt+6&&chance(N.mil==='KR'&&S.mil==='none'&&isAG?80:30));
  if(!pick23){ next(); return; }
  if(!isAG){ const qp=[70,50,30,15,5][N.tier-1]; if(!chance(qp)){ card('bad',`${Y} 奧運資格賽`,`${N.n} U23 沒能拿到奧運門票。`); next(); return; } }
  playTourney(T,Y,false,!u23); next();
}
function playTourney(T,Y,senior,overage){
  const t=NATS[S.nat].tier, b=ntBonus()+(S.traits.intlace?0.05:0)+(S.traits.clutch?0.03:0);
  let i=0; while(i<T.st.length&&chance(((i===0?T.g:T.k)[t-1]+b)*100))i++;
  const apps=3+Math.min(i,T.st.length-1), g=isGK()?0:Math.round(apps*GOAL_BASE[S.dpos]*0.8*(0.6+R()*0.8));
  if(senior){ S.caps+=apps; S.compCaps+=apps; S.intlG+=g; }
  let res, medal=null;
  if(i===T.st.length){ res='冠軍'; medal='金牌'; }
  else if(i===T.st.length-1){ res='亞軍'; medal='銀牌'; }
  else if(i===T.st.length-2&&T.u23&&chance(50)){ res='季軍'; medal='銅牌'; }
  else res=`止步${T.st[i]}`;
  const label=T.u23&&medal?medal:res;
  S.honors.push(`${Y} ${T.n}（${label}${overage?'・超齡':''}）`);
  S.pool+=Math.max(S.traits.intlace?2:0,Math.min(4,i));
  S.intlCount++; if(i>=T.st.length-2)S.intlDeep++;
  card(i>=T.st.length-2?'gold':'info',`${Y} ${T.n}`,`代表${NATS[S.nat].n}${T.u23?' U23':''}${overage?'（超齡球員）':''}出賽 ${apps} 場${g?`、進 ${g} 球`:''}，最終 <b class="hl">${label}</b>。${i>0?`<br>大賽經驗帶來 <b class="up">${Math.min(4,i)}</b> 點能力點。`:''}`);
  /* 韓國兵役:亞運金牌或奧運獎牌免役 */
  if(NATS[S.nat].mil==='KR'&&S.mil==='none'&&((T===T_AG&&medal==='金牌')||(T===T_OLY&&medal))){
    S.mil='exempt'; card('gold','免除兵役',`${T.n}${medal}！依規定<b class="hl">免除兵役</b>，可以專心衝刺職業生涯。`); }
  if(!S.traits.intlace&&S.intlCount>=4&&S.intlDeep>=3)
    traitCard('intlace','只要穿上國家隊球衣，你就是另一個人——<b class="hl">大賽晉級率提升，每屆大賽至少 2 點能力點</b>。');
  if(medal==='金牌'&&S.traits.yips){ removeTrait('yips'); card('good','走出陰影','站上頒獎台的那一刻，腦海裡的雜音消失了——<b class="hl">點球恐懼症痊癒</b>。'); }
  else if(i>=1&&i<T.st.length&&!S.traits.yips&&!S.traits.intlace&&!S.traits.clutch&&chance(6))
    traitCard('yips',`${T.n}淘汰賽輸在點球大戰，那顆球一直在你腦海裡重播——<b class="dn">評分 −0.2、事件卡成功率 −10%，直到拿下聯賽個人獎項或大賽金牌才會痊癒</b>。`,'bad');
}

/* ================= 兵役 ================= */
function militaryCheck(cont){
  const N=NATS[S.nat];
  if(S.stage!=='PRO'||S.mil!=='none'||S.ct.mil){ cont(); return; }
  /* 韓國:28 歲前須入伍,可選尚武隊(在 K1 服役踢球一季) */
  if(N.mil==='KR'&&S.age>=27){
    choose('兵役：28 歲前必須入伍',[
      {t:'加入尚武隊',main:true,s:'下季在韓 K1 的軍隊球隊服役踢球，原合約暫停',f:()=>{ startService(); cont(); }}]);
    return; }
  /* 台灣:23 歲起;人在海外可暫緩,在國內可選延後,27 歲強制 */
  if(N.mil==='TW'&&S.age>=23&&S.age<36){
    if(!N.home.includes(S.lv)){ if(!S.milAbroadNote){ S.milAbroadNote=true; card('info','兵役暫緩','人在海外發展，兵役暫時延後；回國踢球時仍須服役。'); } cont(); return; }
    if(S.age>=27){ S.milNext=true; card('bad','兵役','延後期限已到，下季必須服役（上場時間減少）。'); cont(); return; }
    choose('兵役通知',[
      {t:'延後服役',main:true,s:'明年再說；27 歲前一定要服',f:cont},
      {t:'現在服役',s:'下季上場時間減少，之後就沒有後顧之憂',f:()=>{ S.milNext=true; cont(); }}]);
    return; }
  cont();
}
function startService(){
  S.milRet=S.ct.yrs>0?{lv:S.lv,club:S.club,tier:S.clubTier,rivals:S.rivals,ct:S.ct}:null;
  S.lv='K1'; S.club='金泉尚武'; S.clubTier=2; S.rivals=[]; S.loan=null;
  S.ct={yrs:1,mult:1,lv:'K1',mil:true}; S.mil='serving';
  card('info','入伍',`加入軍隊球隊 <b class="hl">金泉尚武</b>，下季在韓 K1 服役踢球。${S.milRet?`原本與 ${S.milRet.club} 的合約暫停。`:''}`);
  board(2);
}
function endService(){
  S.mil='served'; const r=S.milRet; S.milRet=null;
  card('good','退伍','服役期滿，光榮退伍。');
  if(r){ S.lv=r.lv; S.club=r.club; S.clubTier=r.tier; S.rivals=r.rivals; S.ct=r.ct; card('info','歸隊',`回到 ${S.club}，合約剩 ${S.ct.yrs} 年。`); }
  board(2); return !!r;
}

/* ================= 歸化 ================= */
/* 18 歲後在同一國家踢滿 5 季、且未代表母國踢過成年隊正式賽,可選擇歸化 */
function naturalCheck(cont){
  if(S.stage!=='PRO'){ cont(); return; }
  const c=LV[S.lv].cty;
  if(S.resid.cty===c)S.resid.yrs++; else S.resid={cty:c,yrs:1};
  const T=NATS[c];
  if(!T||c===S.nat||S.natFrom||S.compCaps>0||S.resid.yrs<5||S.natAsked[c]){ cont(); return; }
  S.natAsked[c]=true;
  choose(`${T.n}足協詢問你是否願意歸化`,[
    {t:`保留${NATS[S.nat].n}國籍`,main:true,f:cont},
    {t:`歸化為${T.n}國籍`,warn:true,s:`改走${T.n}國家隊（實力：${NAT_TIERN[T.tier]}、世界盃基準 ${T.wc}%）；母國球迷不會原諒你`,f:()=>{
      S.natFrom=S.nat; S.nat=c; S.ntOn=false;
      card('bad','歸化',`你成為 <b class="hl">${T.n}</b> 公民，之後將代表${T.n}出賽。${NATS[S.natFrom].n}的球迷對此相當憤怒。`); board(2); cont(); }}]);
}

/* ================= 生涯終章 ================= */
/* 生涯分 = Σ 各季 (評分 − 6.0) × 上場 90 分鐘數 × 聯賽權重 + 榮譽加分 */
const ASIA_TOP=['J1','K1','CSL','AUS'], ASIA_2=['J2','K2'];
const lgW=k=>LV[k].top5?1:LV[k].eu?0.6:ASIA_TOP.includes(k)?0.5:ASIA_2.includes(k)?0.3:0.2;
const seasonPts=r=>r.lv&&r.st.App?Math.max(0,r.st.Rt-6.0)*r.st.Min/90:0;
/* 榮譽加分:由上往下取第一個符合的規則 */
const HONOR_PTS=[[/金球獎/,300],[/世界盃（(冠軍|亞軍)/,200],[/世界盃（止步(8 強|4 強)/,100],[/世界盃/,40],
  [/亞洲足球先生/,80],[/最佳球員/,60],[/(英超|西甲|德甲|義甲|法甲)冠軍/,60],[/金靴|金手套/,40],
  [/亞洲盃（冠軍/,60],[/奧運（(金牌|銀牌|銅牌)/,40],[/亞運（金牌/,30],[/亞洲盃（亞軍/,30],
  [/年度最佳陣容/,20],[/冠軍（/,20],[/最佳年輕球員/,10],[/亞洲盃/,10]];
/* 聯賽獎項與冠軍乘上該聯賽權重;國際賽不打折 */
const honorLv=h=>Object.keys(LV).find(k=>h.includes(LV[k].n));
const honorPts=h=>{ const k=honorLv(h), w=k?lgW(k):1; for(const [re,v] of HONOR_PTS)if(re.test(h))return Math.round(v*w); return 0; };
function careerScore(){
  return Math.round(S.log.reduce((s,r)=>s+seasonPts(r)*lgW(r.lv||'TW1'),0)+S.honors.reduce((s,h)=>s+honorPts(h),0));
}
/* 五帶門檻(批次模擬校準):傳奇 2%、巨星 8%、主力 25%、浮沉 40%、過客 25% */
const TIER_TH=[720,480,295,160]; /* 600 段生涯模擬的 p98/p90/p65/p25 */
const TIERS=['傳奇','巨星','主力','浮沉','過客'];
const HOF_TH=210; /* 單一聯賽(未加權)生涯分門檻 */
function mainLeague(){ const m={}; S.log.forEach(r=>{ if(r.lv)m[r.lv]=(m[r.lv]||0)+r.st.Min*lgW(r.lv); }); /* 以加權上場時間選代表聯賽 */
  return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||null; }
function evaluate(){
  const sc=careerScore(), ti=TIER_TH.findIndex(t=>sc>=t), tier=TIERS[ti<0?4:ti], lg=mainLeague(), lgn=lg?LV[lg].n:'';
  const desc={傳奇:`${lgn}歷史級球星`,巨星:`${lgn}頂級球星`,主力:`穩定的${lgn}主力`,浮沉:'在各級聯賽浮沉的職業球員',過客:'職業足壇的過客'}[tier];
  const lines=[`【${tier}】${desc}（生涯分 ${sc}）`];
  /* 名人堂:單一聯賽未加權分 + 該聯賽榮譽 */
  Object.keys(LV).forEach(k=>{ const v=S.log.filter(r=>r.lv===k).reduce((s,r)=>s+seasonPts(r),0)+S.honors.filter(h=>h.includes(LV[k].n)).reduce((s,h)=>s+honorPts(h),0);
    if(v>=HOF_TH)lines.push(`${LV[k].n}名人堂`); });
  const N=NATS[S.nat];
  if(N.tier>=4&&S.honors.some(h=>/世界盃/.test(h)))lines.push(`${N.n}國家英雄：帶領國家踢上世界盃`);
  else if(S.caps>=100)lines.push(`${N.n}國家隊百場功臣`);
  const clubs={}; S.log.forEach(r=>{ if(r.lv&&!r.loan)clubs[r.tm]=(clubs[r.tm]||0)+1; });
  const loyal=Object.keys(clubs).find(c=>clubs[c]>=8); if(loyal)lines.push(`${loyal}的一隊傳奇（效力 ${clubs[loyal]} 季）`);
  if(S.natFrom)lines.push(`歸化球員：${NATS[S.natFrom].n} → ${N.n}`);
  const tr=Object.keys(TRAITN).filter(k=>S.traits[k]).map(k=>TRAITN[k]);
  if(tr.length||S.removed.length)lines.push(`隱藏特質：${tr.join('、')||'—'}${S.removed.length?`（已解除：${S.removed.join('、')}）`:''}`);
  return {sc,tier,lines};
}
function careerTotals(){ return S.log.reduce((t,r)=>{ ['App','G','A','CS','GA'].forEach(k=>t[k]+=r.st[k]); return t; },{App:0,G:0,A:0,CS:0,GA:0}); }
function endGame(reason){
  S.done=true; stepQ=[]; board(2);
  const ev=evaluate(), tot=careerTotals();
  const rows=S.log.map(r=>{ const s=r.st;
    return `<tr><td>${seasonLabel(r.y)}</td><td>${r.age}</td><td>${r.tm}</td><td>${s.App}</td><td>${isGK()?s.CS:s.G}</td><td>${isGK()?s.GA:s.A}</td><td>${s.Rt||'—'}</td></tr>`; }).join('');
  card('gold','生涯落幕',`${reason}<br>職業生涯 ${S.log.filter(r=>r.lv).length} 季，總出場 <b class="hl">${tot.App}</b>，${isGK()?`零封 <b class="hl">${tot.CS}</b>`:`進球 <b class="hl">${tot.G}</b>、助攻 <b class="hl">${tot.A}</b>`}。生涯總薪資 <b class="hl">${fmtMoney(Math.round(S.salary))}</b>。
    ${S.caps?`<br>${NATS[S.nat].n}國家隊出賽 <b class="hl">${S.caps}</b> 場${isGK()?'':`、進 <b class="hl">${S.intlG}</b> 球`}。`:''}
    ${S.honors.length?`<div class="statline">${S.honors.join('<br>')}</div>`:''}
    <table class="fin"><tr><th>賽季</th><th>齡</th><th>球隊</th><th>出場</th><th>${isGK()?'零封':'進球'}</th><th>${isGK()?'失球':'助攻'}</th><th>評分</th></tr>${rows}</table>`);
  const L=S.love, fam=L.st==='married'?`已婚（${L.partner}）${L.kids?`、${L.kids} 個孩子`:''}`:L.st==='dating'?`與 ${L.partner} 交往中`:L.exes.length?`離過 ${L.exes.length} 次婚`:'單身';
  card('info','場外人生',`家庭：${fam}。`);
  card('gold','生涯評價',ev.lines.map((l,i)=>i?`★ ${l}`:`<b class="hl">${l}</b>`).join('<br>')+'<div id="share-out" style="margin-top:8px"></div>');
  choose('',[{t:'▸ 產生結算圖',main:true,f:()=>{ shareImage(ev,$('share-out')); choose('',[{t:'↺ 重新開始',main:true,f:()=>{ location.href=location.pathname; }}]); }},
    {t:'↺ 重新開始',f:()=>{ location.href=location.pathname; }}]);
}
/* 結算圖:畫在 canvas 上,版面比照棒球版 */
function shareImage(ev,out){
  const W=920, PAD=34, scale=2, gk=isGK(), tot=careerTotals();
  const cv=document.createElement('canvas'), c=cv.getContext('2d');
  /* 各聯賽累積 */
  const lgs=Object.keys(S.stats).sort((a,b)=>LV[b].par-LV[a].par);
  /* 榮譽:同名獎項合併年份 */
  const m={}; S.honors.forEach(h=>{ const i=h.indexOf(' '), yr=h.slice(0,i), n=h.slice(i+1); (m[n]=m[n]||[]).push(yr); });
  const honors=Object.keys(m).map(n=>m[n].length>1?`${n} ×${m[n].length}（${m[n].join('、')}）`:`${n}（${m[n][0]}）`);
  c.font='13px sans-serif';
  const colW=(W-PAD*2)/2, maxW=colW-20;
  const blocks=honors.map(h=>{ const L=[]; let cur=''; for(const ch of '· '+h){ if(c.measureText(cur+ch).width>maxW&&cur){ L.push(cur); cur='  '+ch; } else cur+=ch; } if(cur)L.push(cur); return L; });
  const half=Math.ceil(blocks.length/2), hH=Math.max(...[blocks.slice(0,half),blocks.slice(half)].map(b=>b.reduce((s,x)=>s+x.length*23,0)),0);
  const pro=S.log.filter(r=>r.lv);
  let H=140+30+ev.lines.length*24+14+34+(lgs.length+1)*26+16+(S.caps?56:0)+(honors.length?30+hH+16:0)+34+pro.length*20+24+70;
  cv.width=W*scale; cv.height=H*scale; c.scale(scale,scale);
  c.fillStyle='#0b1a12'; c.fillRect(0,0,W,H);
  c.strokeStyle='#2b4a38'; c.lineWidth=3; c.strokeRect(10,10,W-20,H-20);
  c.textBaseline='top';
  c.fillStyle='#8fae9c'; c.font='13px sans-serif'; c.fillText('F o o t L i f e ・ 引 退 紀 念',PAD,30);
  c.fillStyle='#ffc95c'; c.font='bold 36px sans-serif'; c.fillText(S.name,PAD,52);
  c.fillStyle='#e8efe9'; c.font='15px sans-serif';
  c.fillText(`${NATS[S.nat].n}｜${DPN[S.dpos]}｜${S.peakType||playerType()}｜${pro.length?pro[0].y+'–'+(pro.at(-1).y+1):'未登上職業舞台'}｜引退時 ${S.age} 歲`,PAD,98);
  let y=130;
  const hr=()=>{ c.strokeStyle='#2b4a38'; c.lineWidth=1; c.beginPath(); c.moveTo(PAD,y); c.lineTo(W-PAD,y); c.stroke(); y+=12; };
  const title=t=>{ c.fillStyle='#8fae9c'; c.font='bold 13px sans-serif'; c.fillText(t,PAD,y); y+=22; };
  hr(); title('生涯評價');
  ev.lines.forEach((l,i)=>{ c.font=(i?'':'bold ')+'16px sans-serif'; c.fillStyle=i?'#9fd8a8':'#ffc95c'; c.fillText((i?'★ ':'')+l,PAD,y); y+=24; }); y+=6;
  hr(); title('生涯累積數據');
  const cols=[['聯賽',150],['季',50],['出場',70],['分鐘',90],[gk?'零封':'進球',70],[gk?'失球':'助攻',70],['平均評分',90]];
  const row=(cells,head)=>{ let x=PAD; c.font=(head?'bold ':'')+'13px monospace'; c.fillStyle=head?'#8fae9c':'#e8efe9';
    cells.forEach((v,i)=>{ c.fillText(String(v),x,y); x+=cols[i][1]; }); y+=head?24:26; };
  row(cols.map(x=>x[0]),true);
  lgs.forEach(k=>{ const b=S.stats[k], rs=S.log.filter(r=>r.lv===k&&r.st.App), avg=rs.length?(rs.reduce((s,r)=>s+r.st.Rt,0)/rs.length).toFixed(2):'-';
    row([LV[k].n,b.yr,b.App,b.Min,gk?b.CS:b.G,gk?b.GA:b.A,avg]); });
  row(['合計',pro.length,tot.App,'',gk?tot.CS:tot.G,gk?tot.GA:tot.A,'']); y+=6;
  if(S.caps){ hr(); c.fillStyle='#e8efe9'; c.font='14px sans-serif'; c.fillText(`${NATS[S.nat].n}國家隊：出賽 ${S.caps} 場${gk?'':`、進 ${S.intlG} 球`}`,PAD,y); y+=32; }
  if(honors.length){ hr(); title(`生涯榮譽（${honors.length} 項）`);
    c.font='13px sans-serif'; c.fillStyle='#9fd8a8'; const y0=y; let cy=y0;
    blocks.forEach((b,i)=>{ if(i===half)cy=y0; const x=PAD+(i>=half?colW:0); b.forEach(l=>{ c.fillText(l,x,cy); cy+=23; }); });
    y=y0+hH+8; }
  hr(); title('生涯年表');
  const hc=[['賽季',70],['齡',36],['球隊',190],['聯賽',110],['位置',60],['出場',50],[gk?'零封':'進球',50],[gk?'失球':'助攻',50],['評分',60]];
  let x=PAD; c.font='bold 12px monospace'; c.fillStyle='#8fae9c'; hc.forEach(h=>{ c.fillText(h[0],x,y); x+=h[1]; }); y+=20;
  c.font='12px monospace';
  pro.forEach(r=>{ x=PAD; c.fillStyle=r.inj?'#ff8b7a':'#cfe0d4'; const s=r.st;
    [seasonLabel(r.y),r.age,r.tm,LV[r.lv].n,DPN[r.dp],s.App,gk?s.CS:s.G,gk?s.GA:s.A,s.Rt||'-'].forEach((v,i)=>{
      let t=String(v); while(c.measureText(t).width>hc[i][1]-8&&t.length>1)t=t.slice(0,-1); c.fillText(t,x,y); x+=hc[i][1]; }); y+=20; });
  y+=4;
  c.fillStyle='#ffc95c'; c.font='bold 16px sans-serif'; c.fillText('生涯總薪資 '+fmtMoney(Math.round(S.salary))+' 台幣',PAD,y);
  c.fillStyle='#8fae9c'; c.font='11px monospace'; c.fillText('seed: '+SEED,PAD,H-40);
  c.textAlign='right'; c.fillText(APP_VER,W-PAD,H-40); c.textAlign='left';
  const url=cv.toDataURL('image/png'), fileName='足球生涯結算_'+S.name+'.png';
  out.innerHTML=`<img src="${url}" style="width:100%;border-radius:8px" alt="結算圖">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn main" id="sh-save" style="flex:1">儲存／分享圖片</button>
      <button class="btn" id="sh-dl" style="flex:1">下載到裝置</button>
    </div>
    <div class="statline" style="margin-top:6px">若按鈕無效，長按上方圖片也可儲存</div>`;
  const dl=()=>{ const a=document.createElement('a'); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove(); };
  out.querySelector('#sh-dl').onclick=dl;
  /* 分享:優先 Web Share(可存相簿),不支援則退回下載 */
  out.querySelector('#sh-save').onclick=async ()=>{
    try{ const blob=await (await fetch(url)).blob(), file=new File([blob],fileName,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'足球生涯結算',text:S.name+' 的足球人生'}); return; }
    }catch(e){ if(e&&e.name==='AbortError')return; }
    dl(); };
}

/* ================= 開場設定 ================= */
(function(){ const t=$('act-toggle');
  if(t)t.onclick=()=>{ $('act').classList.toggle('collapsed');
    t.textContent=$('act').classList.contains('collapsed')?'⌃ 展開選項':'⌄ 收合選項'; };
})();
$('btn-restart').onclick=function(){ if(confirm('確定要放棄這段人生，從頭開始嗎？'))location.href=location.pathname; };
let selGrp='FW', selNat='TW';
function natDesc(){ const n=NATS[selNat]; $('nat-desc').textContent=`國家隊實力：${NAT_TIERN[n.tier]}｜世界盃基準出線率 ${n.wc}%｜本土聯賽：${n.home.map(k=>LV[k].n).join('、')}${n.mil?'｜有兵役':''}`; }
document.querySelectorAll('#seg-nat button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg-nat button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selNat=b.dataset.v; natDesc();
});
natDesc();
$('seed-show').value=SEED;
$('seed-re').onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$('seed-show').value=SEED;};
document.querySelectorAll('#seg-pos button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg-pos button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selGrp=b.dataset.v;
});
$('btn-start').onclick=()=>{
  const nm=$('in-name').value.trim()||'無名小將';
  const sv=$('seed-show').value.trim(); if(sv)SEED=sv;
  history.replaceState(null,'','?seed='+encodeURIComponent(SEED));
  seedInit(SEED);
  S=newState(nm,selGrp,selNat);
  $('start').style.display='none';
  $('board').style.display=''; $('act').style.display='';
  card('info','球員誕生',`${S.year} 年夏天，${NATS[S.nat].n}${GRPN[S.grp]} <b class="hl">${S.name}</b> 加入 <b class="hl">${S.team}</b>。三年後的路，要自己選。<br><span style="color:var(--dim);font-size:12px">提示：21 歲前累積擲出 5 次「6」可覺醒隱藏特質。</span>`);
  startYear();
};
$('ver-badge').textContent=APP_VER;
</script>
