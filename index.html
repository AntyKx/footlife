<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f1d">
<title>FootLife - 足球人生模擬器</title>
<meta name="description" content="從青訓到世界盃，一場種子化的足球員生涯模擬。簽約、租借、轉會、國家隊、傷病、引退——每一個決定都算數。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23fff%22 stroke=%22%23222%22/%3E%3Cpolygon points=%2216,10 21,14 19,20 13,20 11,14%22 fill=%22%23222%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f1d; --panel:#151a2e; --panel2:#1d2440; --edge:#2a3354;
  --chalk:#eef1f8; --dim:#8b93b0; --amber:#ffcf4a; --clay:#ff8a4c;
  --good:#5fe3a1; --bad:#ff6b6b; --blue:#6cc6ff;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--sans);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#3b2a8a55 0%,transparent 60%);}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* ---------- 記分板 ---------- */
#board{position:sticky;top:0;z-index:20;background:linear-gradient(#1b2040,#121630);
  border-bottom:2px solid var(--edge);padding:10px 14px 8px;box-shadow:0 6px 18px #0009}
#bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#bd-name{font-weight:900;font-size:17px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-name small{color:var(--dim);font-weight:500;font-size:12px;margin-left:6px}
#bd-team{color:var(--amber);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#bd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bd-cell{background:#0e1226;border:1px solid var(--edge);border-radius:6px;padding:4px 6px 3px;text-align:center}
.bd-cell b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--amber);
  text-shadow:0 0 8px #ffcf4a55;line-height:1.2}
.bd-cell span{font-size:10px;color:var(--dim);letter-spacing:.15em}
#lamps{display:flex;gap:14px;justify-content:center;margin-top:7px}
.lamp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.lamp i{width:9px;height:9px;border-radius:50%;background:#262d4a;border:1px solid #3a4466;display:inline-block}
.lamp.on{color:var(--chalk)} .lamp.on i{background:var(--amber);box-shadow:0 0 8px var(--amber);border-color:var(--amber)}
/* ---------- 主紀錄 ---------- */
#log{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;
  animation:pop .25s ease;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;gap:8px}
.card h4::before{content:'';width:8px;height:8px;background:var(--clay);border-radius:2px;transform:rotate(45deg);flex:none}
.card.gold h4::before{background:var(--amber)} .card.bad h4::before{background:var(--bad)}
.card.good h4::before{background:var(--good)} .card.info h4::before{background:var(--blue)}
.card p{font-size:14px} .card p+p{margin-top:4px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:4px;
  background:#0e1226;border:1px solid var(--edge);color:var(--amber);margin:0 2px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--amber);font-weight:700}
.statline{font-family:var(--mono);font-size:12.5px;color:var(--chalk);background:#0e1226;border:1px dashed var(--edge);
  border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.7}
table.fin{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:6px}
table.fin th,table.fin td{border-bottom:1px solid var(--edge);padding:4px 4px;text-align:right}
table.fin th{color:var(--dim);font-weight:500;letter-spacing:.05em}
table.fin td:first-child,table.fin th:first-child{text-align:left}
.divider{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.4em;padding:6px 0 0}
.yr-head{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.3em;padding:8px 0 0;cursor:pointer;user-select:none}
.yr-head:hover{color:var(--amber)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.collapsed .yr-head::after{content:' ▸'}
.yr-block:not(.collapsed) .yr-head.has-body::after{content:' ▾'}
.divider::before,.divider::after{content:'———'}
/* ---------- 操作區 ---------- */
#act{position:sticky;bottom:0;z-index:20;background:linear-gradient(#121630ee,#0c0f1d);border-top:2px solid var(--edge);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
#act .title{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;font-weight:700}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--chalk);
  font-family:var(--sans);font-size:15px;font-weight:700;border-radius:10px;padding:11px 14px;margin-top:8px;
  cursor:pointer;text-align:left;transition:.15s}
.btn:active{transform:scale(.98)} .btn:hover{border-color:var(--amber)}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.btn.main{background:linear-gradient(#5b4bff,#3d33c4);border-color:#7a6cff;text-align:center}
.btn.warn{border-color:#7a3a4a}
/* 骰子 */
#dice{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.die{width:44px;height:44px;border-radius:9px;background:var(--chalk);color:#141a33;font-family:var(--mono);
  font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 0 #0003;position:relative}
.die::after{content:'';position:absolute;inset:4px;border-radius:6px;border:1.5px dashed #ff8a4c55}
.die.used{opacity:.22;transform:scale(.9)} .die.active{outline:3px solid var(--amber);outline-offset:2px}
.die.six{color:#b3402f}
.pool{font-family:var(--mono);font-size:15px;color:var(--amber);margin-bottom:10px}
.abrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:8px;padding:7px 10px;margin-top:6px;cursor:pointer;user-select:none}
.abrow:active{background:var(--panel2)}
.abrow .nm{width:74px;font-size:13.5px;font-weight:700;flex:none}
.abrow .bar{flex:1;height:8px;background:#0e1226;border-radius:4px;overflow:hidden}
.abrow .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a6cff,var(--amber));border-radius:4px;transition:.2s}
.abrow .val{font-family:var(--mono);width:58px;text-align:right;font-size:14px;flex:none}
.abrow .val b{color:var(--good)}
.abrow.capped{opacity:.45}
.abrow{cursor:default}
.abrow .bar{position:relative}
.abrow .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#ffffff66}
.abrow .val{width:84px;line-height:1.15} .abrow .val small{opacity:.5}
.abrow .cst{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.03em}
.abrow .pm{display:flex;align-items:center;gap:4px;flex:none}
.abrow .pm em{font-style:normal;width:26px;text-align:center;font:700 12px var(--mono);color:var(--good)}
.abrow .pm button{width:32px;height:32px;border-radius:8px;border:1px solid var(--edge);background:var(--panel2);color:var(--chalk);
  font:700 17px var(--sans);cursor:pointer;line-height:1}
.abrow .pm .pl{background:linear-gradient(#5b4bff,#3d33c4);border-color:#7a6cff}
.abrow .pm button:disabled{opacity:.25;cursor:default}
.pool small{display:block;font:400 11px var(--sans);color:var(--dim);letter-spacing:.02em;margin-top:2px}
/* 記分板能力面板 */
#bd-abt{display:block;width:100%;margin-top:7px;background:#0e1226;border:1px solid var(--edge);border-radius:6px;color:var(--dim);
  font:700 11px var(--sans);letter-spacing:.2em;padding:3px 0;cursor:pointer}
#bd-abt:active{background:#161b36}
#bd-ab{display:none;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:6px}
#bd-ab.open{display:grid}
.abc{font-size:11px;color:var(--dim);line-height:1.35}
.abc.key .an{color:var(--amber)}
.abc .av{float:right;font-family:var(--mono);color:var(--chalk)} .abc .av small{opacity:.45}
.abc.up .av{animation:flash .8s ease;color:var(--good)}
.abc .ab1{position:relative;height:4px;background:#0e1226;border-radius:2px;margin-top:1px}
.abc .ab1 i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7a6cff,var(--amber));border-radius:2px;transition:width .6s}
.abc .ab1 em{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#ffffff55}
.abc .ab2{height:2px;background:#ffffff0d;border-radius:1px;margin-top:2px}
.abc .ab2 i{display:block;height:100%;background:#6cc6ff;border-radius:1px;transition:width .6s}
.abc.cap .ab2 i{background:#ff8a4c}
/* 訓練卡預覽 */
.tcard .tnow{font:700 11px var(--mono);color:var(--chalk)}
.tcard .tnow b{color:var(--good);font-size:11px}
.tcard .tprog{display:block;height:3px;background:#ffffff14;border-radius:2px;margin:1px 6px 0;overflow:hidden}
.tcard .tprog i{display:block;height:100%;background:#6cc6ff}
.trow{display:flex;align-items:center;gap:8px;margin:2px 0}
.trow .tbar{flex:0 0 70px;height:5px;background:#ffffff14;border-radius:3px;overflow:hidden}
.trow .tbar i{display:block;height:100%;background:#6cc6ff}
#act .row2{display:flex;gap:8px}#act .row2 .btn{flex:1;text-align:center}
/* 生涯大事記(寬螢幕右欄) */
#side{display:none}
#side h3{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin:4px 2px 8px;display:flex;justify-content:space-between}
#side h3 em{font-style:normal;color:var(--amber);font-family:var(--mono)}
#side-empty{color:var(--dim);font-size:12.5px;padding:10px 4px}
.sd{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--blue);border-radius:8px;
  padding:6px 9px;margin-bottom:6px;color:var(--chalk);font-family:var(--sans);cursor:pointer;animation:pop .25s ease}
.sd:hover{border-color:var(--amber)}
.sd.gold{border-left-color:var(--amber)} .sd.red{border-left-color:var(--bad)} .sd.won{border-left-color:var(--good)} .sd.lost{border-left-color:#7a3a4a}
.sd small{display:block;font:700 10.5px var(--mono);color:var(--dim);letter-spacing:.05em}
.sd b{display:block;font-size:13px;line-height:1.35}
.sd span{display:block;font-size:12px;color:var(--dim);line-height:1.4;margin-top:1px}
.card.ping{outline:2px solid var(--amber);outline-offset:2px}
.tblwrap{overflow-x:auto}
table.ltab tr.me td{color:var(--amber);font-weight:700;background:#ffcf4a14}
table.ltab tr.gap td{text-align:center;color:var(--dim);padding:0}
table.awd td:first-child{color:var(--dim);white-space:nowrap;width:6.5em}
table.awd td{text-align:left!important}
.card .call{margin-top:6px;font-size:12.5px;color:#9fd8ff;font-style:italic}
.card .press{margin-top:6px;font-size:13px;color:var(--chalk);border-left:3px solid var(--amber);padding-left:8px}
.card.story{border-color:#7a6cff;box-shadow:0 0 0 1px #7a6cff33 inset}
.card.story h4{color:#b7adff}
.sd.story{border-left-color:#7a6cff}
#btn-side{background:none;border:1px solid #2a3354;color:#8b93b0;border-radius:8px;font:700 11px var(--sans);padding:4px 7px;cursor:pointer;margin-right:6px;white-space:nowrap}
#side-x{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:6px;padding:0 8px;cursor:pointer;font-size:12px}
@media (max-width:1099px){
  #side.open{display:block;position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
}
@media (max-width:480px){ .abrow .nm{width:44px} .abrow .val{width:72px} .abrow{gap:6px;padding:6px 8px} }
@media (min-width:1100px){
  #app{max-width:1400px;display:grid;grid-template-columns:340px minmax(0,1fr) 300px;grid-template-rows:1fr auto auto;column-gap:18px;padding:0 16px}
  #board{grid-column:1;grid-row:1/4;align-self:start;max-height:100vh;max-height:100dvh;overflow-y:auto;
    border:1px solid var(--edge);border-top:none;border-radius:0 0 12px 12px;padding:14px 16px 12px}
  #bd-ab{grid-template-columns:repeat(2,1fr);gap:6px 14px}
  .abc{font-size:12px}
  #log{grid-column:2;grid-row:1;padding:16px 4px 20px}
  #act-toggle{grid-column:2;grid-row:2}
  #act{grid-column:2;grid-row:3;border:1px solid var(--edge);border-bottom:none;border-radius:12px 12px 0 0;
    display:grid;grid-template-columns:1fr 1fr;column-gap:10px;align-content:start}
  #act>*:not(.btn){grid-column:1/-1}
  #act>.btn:last-child:nth-child(even){grid-column:1/-1}
  #btn-side,#side-x{display:none}
  #side{display:block;grid-column:3;grid-row:1/4;align-self:start;position:sticky;top:0;max-height:100vh;max-height:100dvh;overflow-y:auto;padding:16px 2px 24px}
}
/* 開場 */
#start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,#3b2a8aaa,transparent 60%)}
#start .wrap{max-width:560px;margin:0 auto;padding:40px 22px 60px}
#start h1{font-size:34px;font-weight:900;letter-spacing:.08em;line-height:1.25;margin-top:18px}
#start h1 em{font-style:normal;color:var(--amber)}
#start .sub{color:var(--dim);margin:10px 0 26px;font-size:13.5px;letter-spacing:.08em}
.field{margin-top:18px}
.field label{display:block;font-size:12px;letter-spacing:.25em;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--chalk);
  font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none}
.field input:focus{border-color:var(--amber)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--dim);
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:11px 4px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--amber);border-color:var(--amber)}
.seedline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:22px}
.seedline b{color:var(--amber)}
.stitch{width:64px;height:64px;border-radius:50%;background:var(--chalk);position:relative;box-shadow:inset -6px -8px 0 #00000014}
.stitch::before,.stitch::after{content:'';position:absolute;top:8px;bottom:8px;width:18px;
  border:3px dashed #b3402f;border-top:none;border-bottom:none}
.stitch::before{left:8px;border-right:none;border-radius:50% 0 0 50%}
.stitch::after{right:8px;border-left:none;border-radius:0 50% 50% 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{position:relative}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffcf4a66;border-radius:1px}
#btn-restart{background:none;border:1px solid #2a3354;color:#8b93b0;border-radius:8px;
 font-size:14px;line-height:1;padding:4px 8px;margin-left:8px;cursor:pointer;flex:none}
#btn-restart:active{background:#1a2040}
#act-toggle{display:block;margin:0 auto -4px;background:#0f1428;border:1px solid #2a3354;
 border-bottom:none;color:#8b93b0;font-size:11px;padding:3px 14px;border-radius:10px 10px 0 0;cursor:pointer}
#act.collapsed{display:none!important}
.ball{width:64px;height:64px;border-radius:50%;background:var(--chalk);position:relative;box-shadow:inset -6px -8px 0 #00000014}
.ball::before{content:'';position:absolute;left:21px;top:20px;width:22px;height:22px;background:#141a33;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
/* ---------- M7:轉播比分條、量表、時間軸 ---------- */
#bd-top{align-items:center}
#bd-num{flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font:900 15px var(--mono);color:#fff;text-shadow:0 1px 2px #0008;box-shadow:inset 0 -3px 0 #0003,0 0 0 1px #ffffff22;margin-right:9px;transition:background .6s}
#bd-name{flex:1;min-width:0}
#bd-bug{display:flex;margin-top:8px;border-radius:6px;overflow:hidden;border:1px solid var(--edge);font-size:12.5px;font-weight:700;line-height:1.9}
#bd-lg{background:var(--amber);color:#141a33;padding:0 8px;white-space:nowrap}
#bd-team{flex:1;background:#0e1226;padding:0 10px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
#bd-clock{background:#5b4bff;color:#fff;padding:0 10px;font-family:var(--mono);min-width:44px;text-align:center}
#bd-meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.mt{position:relative;font-size:10px;color:var(--dim);letter-spacing:.08em}
.mt i{display:block;height:5px;background:#0e1226;border-radius:3px;overflow:hidden;margin-top:2px;border:1px solid #ffffff10}
.mt i b{display:block;height:100%;width:50%;background:linear-gradient(90deg,#7a6cff,#6cc6ff);border-radius:3px;transition:width .7s ease}
#mt-fans i b{background:linear-gradient(90deg,#ff8a4c,#ffcf4a)} #mt-form i b{background:linear-gradient(90deg,#6cc6ff,#5fe3a1)}
.mt em{position:absolute;right:0;top:0;font-style:normal;font-family:var(--mono);color:var(--chalk)}
.mt.lo em{color:var(--bad)} .mt.hi em{color:var(--amber)}
.mfloat{position:absolute;right:22px;top:-2px;font:700 11px var(--mono);animation:mfloat 1.2s ease forwards;pointer-events:none}
@keyframes mfloat{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-14px)}}
#bd-time{position:relative;display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:8px;padding-bottom:10px}
#bd-time span.on{color:var(--chalk);font-weight:700}
#bd-track{position:absolute;left:0;right:0;bottom:1px;height:3px;background:#262d4a;border-radius:2px}
#bd-fill{position:absolute;left:0;top:0;bottom:0;width:4%;background:var(--amber);border-radius:2px;transition:width .9s ease}
#bd-ball{position:absolute;top:50%;left:4%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,#cfd5e6);box-shadow:0 0 6px #fff8;transition:left .9s ease}
#bd-time[data-ph="1"] #bd-fill{width:50%} #bd-time[data-ph="1"] #bd-ball{left:50%}
#bd-time[data-ph="2"] #bd-fill{width:100%} #bd-time[data-ph="2"] #bd-ball{left:calc(100% - 6px)}
.bd-cell b.flash{animation:flash .8s ease}
@keyframes flash{0%{color:#fff;transform:scale(1.25)}100%{transform:none}}
/* 球場線背景 */
body{background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#3b2a8a55 0%,transparent 60%),

  background-size:auto,min(560px,100vw) auto;background-position:center,center top;background-repeat:no-repeat;background-attachment:scroll,fixed}
/* 卡片圖示:壞事＝黃牌、嚴重＝紅牌、關鍵時刻＝足球、對話＝泡泡 */
.card.bad h4::before{width:7px;height:10px;border-radius:1.5px;background:#ffd23f;transform:rotate(10deg)}
.card.red h4::before{background:#ff4d4d}
.card.moment h4::before{width:10px;height:10px;border-radius:50%;transform:none;background:radial-gradient(circle at 35% 35%,#fff,#aab3cc)}
.card.talk h4::before{width:11px;height:9px;border-radius:6px 6px 6px 1px;transform:none;background:var(--blue)}
.card.talk.good h4::before{background:var(--good)} .card.talk.bad h4::before{background:#ffd23f;border-radius:1.5px;width:7px;height:10px;transform:rotate(10deg)}
.card.moment.won{border-color:#ffcf4a66} .card.moment.lost{border-color:#ff6b6b44}
.card.flip{animation:flip .45s ease}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-70deg)}to{opacity:1;transform:none}}
/* 關鍵時刻 */
.mhead{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
.mmin{font-family:var(--mono);background:var(--amber);color:#141a33;border-radius:4px;padding:0 6px;font-weight:700}
.msc{font-family:var(--mono);color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg.scene{display:block;width:100%;height:auto;margin-top:8px;border-radius:8px;border:1px solid var(--edge);
  background:repeating-linear-gradient(180deg,#1a2147 0 24px,#18204a 24px 48px)}
.scene .pl{fill:none;stroke:#ffffff38;stroke-width:1.2} .scene .pdot{fill:#ffffff66}
.scene .goal{fill:#ffffff12;stroke:#ffffffcc;stroke-width:1.3;transform-origin:150px -3px;transform-box:view-box}
.scene.hit .goal{animation:net .6s ease .75s}
@keyframes net{30%{transform:scaleX(1.08) translateY(-2px)}60%{transform:scaleX(.97)}100%{transform:none}}
.scene .me{fill:var(--amber);stroke:#fff;stroke-width:1.4}
.scene .mepl{animation:mepulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes mepulse{50%{opacity:.75}}
.scene .metx{font:800 7px var(--mono);fill:#141a33;text-anchor:middle}
.scene .mate{fill:#7a6cff;stroke:#c9c2ff;stroke-width:1} .scene .opp{fill:#ff6b6b;stroke:#ffc2c2;stroke-width:1} .scene .ogk{fill:#6cc6ff;stroke:#d6f0ff;stroke-width:1}
.scene .ballp{fill:#fff;stroke:#141a33;stroke-width:.9;transition:transform .8s cubic-bezier(.25,.8,.3,1)}
.mtell{font-size:12.5px;color:var(--blue);margin-top:6px}
.mres{margin-top:6px;font-size:14px} .mres:empty{display:none}
.mres .fx{font-size:12.5px;color:var(--dim)} .readok{margin-left:6px;font-size:12px;color:var(--blue)}
.var{font:700 12px var(--mono);color:#141a33;background:var(--blue);display:inline-block;padding:0 8px;border-radius:4px;animation:varout 1s ease both}
.var i{font-style:normal;animation:blink .4s steps(2) infinite}
@keyframes varout{0%,80%{opacity:1}100%{opacity:0;height:0;padding:0;margin:0}}
@keyframes blink{50%{opacity:0}}
.vres{animation:fadein .4s ease 1s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 談判對話泡泡 */
.chat p{max-width:88%;padding:6px 10px;border-radius:12px;margin-top:6px;font-size:13.5px;animation:pop .25s ease}
.chat .ag{background:#1d2440;border-bottom-left-radius:3px}
.chat .me{background:#3d33c4;margin-left:auto;border-bottom-right-radius:3px}
.chat .cl{background:#262d4a;border-bottom-left-radius:3px}
.chat .cl.up{border:1px solid #5fe3a155} .chat .cl.dn{border:1px solid #ff6b6b55}
/* 訓練卡 */
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tcard{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:7px 4px 6px;text-align:center;cursor:pointer;
  user-select:none;display:flex;flex-direction:column;gap:2px;animation:deal .35s ease both;transition:transform .15s,border-color .15s,background .15s}
@keyframes deal{from{opacity:0;transform:translateY(16px) rotate(-4deg)}to{opacity:1;transform:none}}
.tcard b{font-size:12px;line-height:1.25} .tcard .tab{font-size:11px;color:var(--dim)}
.tcard .tpow{font-size:9.5px;color:var(--amber);letter-spacing:-1px} .tcard .tpow i{font-style:normal;color:#ffffff22}
.tcard small{font-size:9.5px;color:var(--dim);line-height:1.3}
.tcard.key{border-color:#ffcf4a77} .tcard.key .tab{color:var(--amber)}
.tcard.six{box-shadow:0 0 10px #ffcf4a44}
.tcard.sel{background:#2a2470;border-color:#7a6cff;transform:translateY(-4px);box-shadow:0 6px 14px #0008}
@media (max-width:420px){.tgrid{grid-template-columns:repeat(3,1fr)}}
/* 大字特效與彩帶 */
.bigfx{position:fixed;left:50%;top:38%;z-index:80;font:900 60px/1 var(--sans);letter-spacing:.06em;color:var(--amber);white-space:nowrap;
  text-shadow:0 4px 24px #000c,0 0 34px #ffcf4a88;animation:big 1.3s ease forwards;pointer-events:none;transform:translate(-50%,-50%)}
.bigfx.cool{color:var(--blue);text-shadow:0 4px 24px #000c,0 0 34px #6cc6ff88}
@keyframes big{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.conf{position:fixed;top:-14px;width:7px;height:12px;z-index:79;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(760deg)}}
.ball{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(25deg)}}
.hlrow{font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--edge)} .hlrow:last-child{border-bottom:none}
.hlrow b{font-family:var(--mono);color:var(--amber);font-weight:700}
@media (prefers-reduced-motion:reduce){.var{display:none}}
</style>

function stepCost(cur){ return isGK()?(cur>=60?7:cur>=53?4:cur>=46?2:1):(cur>=62?5:cur>=55?3:cur>=47?2:1); }
function lvCost(k,cur){ /* 從 cur 升一級的成本;天花板之上:門將×4、場上×3 */
  const pk=(S.pot&&S.pot[k])||62; let c=stepCost(cur); if(cur>=pk)c*=isGK()?4:3; return c; }

/* 純試算:在 st={ab,carry} 上套用 v 點,不動 S;給訓練卡預覽用,公式與 addAb 相同 */
function abSim(st,k,v){ let cur=st.ab[k],bud=v+(st.carry[k]||0);
  while(bud>0&&cur<80){ const c=lvCost(k,cur); if(bud>=c){bud-=c;cur++;} else break; }
  st.ab[k]=cur; st.carry[k]=cur>=80?0:bud; }
function addAb(k,v){ if(!(k in S.ab))return 0; const o=S.ab[k];
  if(v<0){ S.ab[k]=clamp(o+v,1,80); return S.ab[k]-o; } /* 扣值 1:1,不吃量表成本 */
  let cur=o,bud=v+(S.carry[k]||0); /* 未滿一級的點數累積在進度槽 */
  while(bud>0&&cur<80){
    const cost=lvCost(k,cur);
    if(bud>=cost){bud-=cost;cur++;} else break; }
  S.carry[k]=cur>=80?0:bud;
  S.ab[k]=cur; return cur-o; }

/* 記分板能力面板:數值/潛力、能力條(白線＝潛力)、下方細條＝升下一級的累積進度;黃字＝計入目前位置綜合 */
let AB_PREV=null;
function abPanel(){
  const p=$('bd-ab'), keys=GRP_AB[S.grp], w=DP_W[S.dpos], prev=AB_PREV||{};
  p.innerHTML=keys.map(k=>{ const v=S.ab[k], pk=(S.pot&&S.pot[k])||62, c=lvCost(k,v), cr=(S.carry&&S.carry[k])||0;
    const cls='abc'+(w[k]?' key':'')+(v>=pk?' cap':'')+(prev[k]!=null&&v>prev[k]?' up':'');
    return `<div class="${cls}" title="${v>=80?'已達頂':`升下一級需 ${c} 點，已累積 ${cr}`}${v>=pk?'（已過潛力，成本加倍）':''}"><span class="an">${ABL[k]}</span><span class="av">${v}<small>/${pk}</small></span>`+
      `<div class="ab1"><i style="width:${v/80*100}%"></i><em style="left:${pk/80*100}%"></em></div><div class="ab2"><i style="width:${v>=80?100:cr/c*100}%"></i></div></div>`; }).join('');
  AB_PREV={...S.ab};
}
function actClear(){ const a=$('act'); a.innerHTML=''; a.classList.remove('collapsed');
  const t=$('act-toggle'); if(t)t.style.display='none'; }
function actToggleSync(){
  const a=$('act'), t=$('act-toggle'); if(!t)return;
  const has=a.innerHTML.trim()!=='' && a.style.display!=='none';

let LASTCH=null, CUR_OPT=null; /* 談判時用來回到上一層選單 */
function choose(title,opts){

/* 加點介面:mode {pool:n};每項能力 −/＋,點數用完才能確認 */
function allocUI(mode,label,done){
  actClear(); const a=$('act'), keys=GRP_AB[S.grp], w=DP_W[S.dpos], total=mode.pool||0, hist={}; let pool=total;
  a.innerHTML=`<div class="title">${label}</div><div class="pool" id="al-top"></div><div id="al-rows"></div><div class="row2" id="al-btm"></div>`;
  const top=$('al-top'),rows=$('al-rows'),btm=$('al-btm'), used=k=>(hist[k]||[]).length;
  function plus(k){ if(pool<=0||S.ab[k]>=80)return; const pc=S.carry[k]||0, got=addAb(k,1); (hist[k]=hist[k]||[]).push([got,pc]); pool--; render(); board(0); }
  function minus(k,quiet){ const h=hist[k]; if(!h||!h.length)return; const [got,pc]=h.pop(); S.ab[k]-=got; S.carry[k]=pc; pool++; if(!quiet){ render(); board(0); } }
  function render(){
    top.innerHTML=`剩餘 <b>${pool}</b> / ${total} 點<small>黃字＝目前位置計入綜合｜「下一級」＝已累積／升一級所需點數，超過潛力成本加倍</small>`;
    rows.innerHTML='';
    keys.forEach(k=>{ const v=S.ab[k],cap=v>=80,pk=(S.pot&&S.pot[k])||62,cst=abCost(k),cr=(S.carry&&S.carry[k])||0,u=used(k);
      const r=document.createElement('div'); r.className='abrow'+(cap?' capped':'');
      r.innerHTML=`<span class="nm"${w[k]?' style="color:var(--amber)"':''}>${ABL[k]}</span>`+
        `<span class="bar"><i style="width:${v/80*100}%"></i><em style="left:${pk/80*100}%"></em></span>`+
        `<span class="val">${v}<small>/${pk}</small><span class="cst">${cap?'已達頂':`下一級 ${cr}/${cst}`}</span></span>`+
        `<span class="pm"><button class="mi"${u?'':' disabled'}>−</button><em>${u?'+'+u:''}</em><button class="pl"${!cap&&pool>0?'':' disabled'}>＋</button></span>`;
      r.querySelector('.mi').onclick=()=>minus(k); r.querySelector('.pl').onclick=()=>plus(k);
      rows.appendChild(r); });
    btm.innerHTML='';
    const any=keys.some(k=>used(k)), u=document.createElement('button'); u.className='btn'; u.style.textAlign='center';
    u.textContent='↩ 全部重來'; u.disabled=!any; u.style.opacity=any?'1':'.35';
    if(any)u.onclick=()=>{ keys.forEach(k=>{ while(used(k))minus(k,true); }); render(); board(0); };
    btm.appendChild(u);
    const allCap=keys.every(k=>S.ab[k]>=80), c=document.createElement('button'); c.className='btn main';
    if(pool>0&&!allCap){ c.disabled=true; c.style.opacity='.5'; c.textContent=`還有 ${pool} 點可分配`; }
    else { c.textContent=pool>0?'能力已達上限，捨棄剩餘點數 ▸':'確認 ▸'; c.onclick=()=>{ actClear(); done(); }; }
    btm.appendChild(c); actToggleSync(); }
  render(); scrollBottom();
}

const METERN={trust:'教練信任',fans:'球迷人氣',form:'狀態'};
function meter(k,v){ v=Math.round(v); if(!v)return ''; const o=S[k]; S[k]=clamp(o+v,0,100); const d=S[k]-o; if(!d)return '';
  board(); meterFx(k,d);
  return `${METERN[k]} <span class="${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>`; }
function meterFx(k,d){ const el=$('mt-'+k); if(!el)return; const f=document.createElement('span');
  f.className='mfloat '+(d>0?'up':'dn'); f.textContent=(d>0?'+':'')+d; el.appendChild(f); setTimeout(()=>f.remove(),1300); }
/* 教練信任換算成與競爭者的能力差:信任 90 約 +5、信任 10 約 −5 */
const trustGap=()=>Math.round((S.trust-50)/8);
/* 季末:表現影響信任與人氣,再慢慢回歸 */
function metersSeason(st){
  if(st.App>0){ meter('trust',st.Rt>=7.3?6:st.Rt>=6.9?2:st.Rt<6.5?-6:0);
    if(S.stage==='PRO')meter('fans',clamp((st.Rt-6.6)*15,-6,10)+(S.ntOn?3:0)); }

}

/* key = 目前位置權重最高的能力;'a|b' = 場上球員 a、門將 b */
function dKey(k){ const keys=Object.keys(DP_W[S.dpos]);
  if(k.includes('|')){ const [a,b]=k.split('|'); k=isGK()?b:a; if(k in S.ab)return k; k='key'; }
  if(k==='key')return Object.entries(DP_W[S.dpos]).sort((a,b)=>b[1]-a[1])[0][0]; if(k==='rand')return pick(GRP_AB[S.grp]);
  if(k==='weak')return keys.slice().sort((a,b)=>S.ab[a]-S.ab[b])[0]; if(k==='best')return keys.slice().sort((a,b)=>S.ab[b]-S.ab[a])[0];
  return k in S.ab?k:pick(keys); }
function applyFx(fx){ const out=[];
  ['trust','fans','form'].forEach(k=>{ if(fx[k])out.push(meter(k,fx[k])); });
  if(fx.ab){ const k=dKey(fx.ab[0]), v=fx.ab[1];
    out.push(v>0?loveGainTxt(k,v):`${ABL[k]} <span class="dn">${addAb(k,v)}</span>`); }
  if(fx.inj){ S.tmpInj+=fx.inj; out.push(`本季受傷機率 <span class="${fx.inj>0?'dn':'up'}">${fx.inj>0?'+':''}${fx.inj}%</span>`); }
  if(fx.pay){ const p=Math.round((S.lv?LV[S.lv].sal:30)*0.1*fx.pay*(fx.pay>0?0.7+S.fans/170:1)); S.salary+=p;
    out.push(p>=0?`收入 <span class="up">+${fmtMoney(p)}</span>`:`支出 <span class="dn">${fmtMoney(-p)}</span>`); }
  if(fx.nt){ const o=S.ntRep; S.ntRep=clamp(S.ntRep+fx.nt,-3,3); const d=S.ntRep-o; if(d)out.push(`國家隊教練印象 <span class="${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>`); }
  if(fx.want)S.wantOut=true; if(fx.loyal)S.wantOut=false; if(fx.rumor)S.rumor=true;
  if(fx.flag){ S.flags=S.flags||{}; S.flags[fx.flag]=1; }
  return out.filter(Boolean);
}
function dialogEvent(done){

  S.seenDlg=S.seenDlg||[];
  let pool=DIALOGS.filter(x=>(nt?x.st==='NT':(x.st==='ANY'||x.st===st))&&(!x.c||x.c()));
  const fresh=pool.filter(x=>!S.seenDlg.includes(x.n)); if(fresh.length)pool=fresh;
  const dg=arc?arc.mk():pick(pool);
  if(!arc){ S.seenDlg.push(dg.n); if(S.seenDlg.length>8)S.seenDlg.shift(); }
  const el=card(arc?'talk story':'talk',(arc?'劇情｜':'場外｜')+dg.n,`<p>${dg.d}</p><div class="mres"></div>`);

function arcDue(){ if(!S.arcs||!chance(55))return null;
  const due=[];
  Object.keys(ARCS).forEach(id=>{ const st=S.arcs[id]; if(!st||st.out)return;
    ARCS[id].forEach(ev=>{ const n=st.done[ev.id]||0;
      if(n<(ev.rep||1)&&st.last!==S.year&&(!st.lastEv||!ev.gap||st.lastEv!==ev.id||S.year-st.last>=ev.gap)&&ev.when(st))due.push({id,ev,st}); }); });
  if(!due.length)return null;
  /* 每條線一次只推進最早的事件 */
  const first={}; due.forEach(x=>{ if(!first[x.id])first[x.id]=x; });
  const x=pick(Object.values(first));
  return {mk:()=>x.ev.mk(x.st),after:(i,ok,dice)=>{ x.st.done[x.ev.id]=(x.st.done[x.ev.id]||0)+1; x.st.last=S.year; x.st.lastEv=x.ev.id;
    if(x.ev.after)x.ev.after(x.st,i,ok,dice); if(x.id==='cb'&&!ARCS.cb.some(e=>!(x.st.done[e.id])))delete S.arcs.cb; }};
}

/* ================= 季前訓練營(取代擲骰) ================= */
/* 發 5 堂課選 3 堂;強度 1–6 星(天才 4 起、大器晚成 3 起、學院派 2 起),強度 = 投入該能力的點數 */
const TRAIN_OUT=[{n:'射門特訓',k:'sho',f:8},{n:'衝刺訓練',k:'pac',f:15},{n:'重量訓練',k:'phy',f:12,x:'sta'},{n:'盤帶技術課',k:'dri',f:8},
  {n:'傳球組織',k:'pas',f:6},{n:'防守站位',k:'def',f:8},{n:'頭球對抗',k:'hea',f:10},{n:'影片分析',k:'vis',f:0,form:4},
  {n:'耐力長跑',k:'sta',f:15},{n:'戰術演練',k:'key',f:6,trust:4},{n:'弱點補強',k:'weak',f:10},{n:'恢復休息',k:null,f:-25,form:6}];
const TRAIN_GK=[{n:'反應訓練',k:'ref',f:8},{n:'站位課',k:'gkp',f:4},{n:'高空球訓練',k:'cmd',f:12},{n:'腳下技術',k:'kic',f:6},
  {n:'體能循環',k:'sta',f:15},{n:'點球分析',k:'gkp',f:0,form:4},{n:'戰術演練',k:'key',f:6,trust:4},{n:'弱點補強',k:'weak',f:10},{n:'恢復休息',k:null,f:-25,form:6}];
function training(){
  const keys=Object.keys(DP_W[S.dpos]);
  const hand=shuffle((isGK()?TRAIN_GK:TRAIN_OUT).slice()).slice(0,5).map(c=>{ /* k 在這裡定案,預覽與套用一致 */
    const k=c.k==='key'?pick(keys):c.k==='weak'?keys.slice().sort((a,b)=>S.ab[a]-S.ab[b])[0]:c.k;
    const v=c.k?(S.traits.genius?ri(4,6):S.traits.late?ri(3,6):S.traits.scholar?ri(2,6):ri(1,6)):0;
    return {...c,k,v,p:c.k?Math.max(1,Math.round(v*ageMul())):0}; }); /* p = 實際投入點數(年齡修正) */
  let need=S.skipMid?2:(chance(15)?4:3); if(S.traits.distract&&!S.skipMid)need=Math.max(2,need-1); /* 外務纏身 */
  card('','季前訓練營',`教練組排出 5 堂訓練課，你可以選 <b class="hl">${need}</b> 堂。${need===4?'教練加開了一個訓練時段！':''}${S.skipMid?'（復健中，只能選 2 堂）':''}`);
  trainUI(hand,need,sel=>applyTraining(hand.filter((c,i)=>sel.includes(i))));
}
/* 成長黃金期:18–23 歲訓練效率 ×1.35,24 歲起遞減(星數不變,只影響實際點數) */
function ageMul(){ const a=S.age; return a<=17?1:a<=23?1.35:a<=26?0.9:a<=29?0.45:0.35; }
function trainUI(hand,need,done){
  actClear(); const a=$('act'), sel=[], keyAb=DP_W[S.dpos], am=ageMul();
  const amTxt=am>1?`<span style="color:var(--good)">｜成長黃金期：點數 ×${am}</span>`:am<1?`<span style="color:var(--dim)">｜年齡：點數 ×${am}</span>`:'';
  a.innerHTML=`<div class="title">季前訓練營：選 ${need} 堂課（星數＝訓練量，選完後自由分配點數）${amTxt}</div><div class="tgrid" id="tg"></div><div class="row2" id="tb"></div>`;
  function render(){
    const tg=$('tg'); tg.innerHTML='';
    hand.forEach((c,i)=>{ const on=sel.includes(i), d=document.createElement('div');
      d.className='tcard'+(on?' sel':'')+(c.v===6?' six':'');
      d.style.animationDelay=(i*70)+'ms';
      d.innerHTML=`<b>${c.n}</b><span class="tab">${c.k?`訓練量 <b class="hl">+${c.p+(c.x?1:0)}</b>`:'恢復'}</span>`+
        `<span class="tpow">${c.k?'★'.repeat(c.v)+'<i>'+'★'.repeat(6-c.v)+'</i>':'－'}</span>`+
        `<small>${[c.f?`疲勞 ${c.f>0?'+':''}${c.f}`:'',c.form?`狀態 +${c.form}`:'',c.trust?`信任 +${c.trust}`:''].filter(Boolean).join('｜')}</small>`;
      if(on||sel.length<need)d.onclick=()=>{ if(on)sel.splice(sel.indexOf(i),1); else sel.push(i); render(); };
      tg.appendChild(d); });
    const tb=$('tb'); tb.innerHTML=''; const fat=clamp(20+sel.reduce((s,i)=>s+hand[i].f,0),0,100), pts=sel.reduce((s,i)=>s+hand[i].p+(hand[i].x?1:0),0);
    const c=document.createElement('button'); c.className='btn main';
    if(sel.length<need){ c.disabled=true; c.style.opacity='.5'; c.textContent=`再選 ${need-sel.length} 堂`; }
    else { c.innerHTML=`確認訓練 ▸<small>訓練點數 ${pts}｜預估疲勞 ${fat}${fat>=55?'（受傷風險上升）':''}</small>`; c.onclick=()=>{ actClear(); done(sel); }; }
    tb.appendChild(c); actToggleSync(); }
  render(); scrollBottom();
}
function applyTraining(ch){
  const out=[]; let six=0, fat=20, pool=0;
  ch.forEach(c=>{ fat+=c.f;
    if(c.k){ const g=c.p+(c.x?1:0); pool+=g; out.push(`<div class="trow">${c.n}：訓練點數 <b class="up">+${g}</b></div>`);
      if(c.v===6&&S.age<21&&!S.traits.genius){ S.six++; six++; } }
    else out.push(`<div class="trow">${c.n}：疲勞 −25</div>`);
    if(c.form)meter('form',c.form); if(c.trust)meter('trust',c.trust); });
  S.fatigue=clamp(fat,0,100);
  card('good','訓練成果',out.join('')+`共 <b class="hl">${pool}</b> 點可自由分配｜本季疲勞度 <b class="${S.fatigue>=55?'dn':'hl'}">${S.fatigue}</b>${S.fatigue>=55?'（受傷風險上升）':''}`+
    (six?`<br>滿強度訓練累計 <b class="hl">${S.six}/5</b> 次`:''));
  if(S.six>=5&&!S.traits.genius&&S.age<21)
    traitCard('genius','21 歲前五度完成滿強度訓練！從今以後，每堂訓練課<b class="hl">永久 4 星以上</b>，關鍵時刻成功率 <b class="hl">+12%</b>。'+awaken());
  /* 大器晚成:25～31 歲、綜合仍未滿 46,單季最強三堂課強度總和 ≥ 15 */
  const top3=ch.map(c=>c.v).sort((a,b)=>b-a).slice(0,3).reduce((a,b)=>a+b,0);
  if(!S.traits.late&&!S.traits.genius&&S.age>=25&&S.age<32&&ovr()<46&&top3>=15)
    traitCard('late','別人都以為你到頂了，你卻在這一年脫胎換骨——每堂訓練課<b class="hl">永久 3 星以上</b>，關鍵時刻成功率 <b class="hl">+12%</b>。'+awaken());
  board(0);
  if(!pool){ nextStep(); return; }
  const before={...S.ab};
  allocUI({pool},`季前訓練：自由分配 ${pool} 點`,()=>{
    const ch2=Object.keys(before).filter(k=>S.ab[k]!==before[k]).map(k=>`${ABL[k]} ${before[k]} → <b class="up">${S.ab[k]}</b>`);
    card('','能力成長',ch2.length?ch2.join('｜'):'點數都存進了升級進度，下一級就快到了。'); board(0); nextStep(); });
}

/* ================= 合約談判 ================= */
/* 選了報價後進入談判:直接簽、要求加薪、要求先發保證;失敗時若還有別的路可走,對方可能撤回報價 */
function negotiate(of,onSign){
  const L=LV[of.lv], est=salaryFor(of.lv,ovr()-L.par,TIER_PAY[of.tier]), lev=ovr()-(L.par+TIER_PAR[of.tier]);
  const pRaise=clamp(Math.round(45+lev*6+(S.fans-50)/4),10,90), pStart=clamp(Math.round(40+lev*7),5,90);
  const back=LASTCH, me=CUR_OPT, rest=back?back.opts.filter(o=>o!==me):[], canWalk=rest.some(o=>o.offer||o.stay);
  const renew=of.club===S.club&&S.stage==='PRO';
  const el=card('talk','談判桌｜'+of.club,`<div class="chat"><p class="ag">經紀人：「${of.club}${renew?'提出續約':'開出'} ${of.yrs} 年、年薪約 ${fmtMoney(est)}。要再爭取一下嗎？」</p></div>`);
  const chat=(who,t,cls)=>{ el.querySelector('.chat').insertAdjacentHTML('beforeend',`<p class="${who} ${cls||''}">${t}</p>`); scrollBottom(); };
  const sign=(mult,promise)=>{ onSign(); if(mult>1)S.ct.mult*=mult; if(promise)S.trust=Math.max(S.trust,70); board(); advance(); };
  const walkBack=()=>choose(back.title,rest);
  const tryAsk=(p,kind)=>{ chat('me',kind==='raise'?'「年薪要再加兩成。」':'「我要先發位置的保證。」');
    if(chance(p)){ chat('cl',`${of.club}：「成交。」`,'up'); sign(kind==='raise'?1.2:1,kind==='start'); return; }
    if(canWalk&&chance(35)){ chat('cl',`${of.club}：「那就算了。」對方撤回報價。`,'dn'); walkBack(); return; }
    chat('cl',`${of.club}：「這是我們的極限。」`,'dn');
    choose(`與 ${of.club} 談判`,[{t:'接受原條件',main:true,f:()=>sign(1,false)},...(canWalk?[{t:'放棄這份報價',f:walkBack}]:[])]); };
  choose(`與 ${of.club} 談判`,[
    {t:'直接簽約',main:true,s:`${of.yrs} 年｜年薪約 ${fmtMoney(est)}`,f:()=>{ chat('me','「沒問題，簽了。」'); sign(1,false); }},
    {t:'要求加薪 20%',s:`成功率 ${pRaise}%｜${canWalk?'失敗時對方可能撤回報價':'失敗就照原條件簽'}`,f:()=>tryAsk(pRaise,'raise')},
    {t:'要求先發保證',s:`成功率 ${pStart}%｜成功：教練信任至少 70｜${canWalk?'失敗時對方可能撤回報價':'失敗就照原條件簽'}`,f:()=>tryAsk(pStart,'start')},
    ...(canWalk?[{t:'回到報價清單',f:walkBack}]:[])]);
}

/* ================= 年度流程 ================= */

/* ---------- 季前 ---------- */
function phasePre(){
  arcSeason(); board(0); S.tmpInj=S.nextInj||0; S.nextInj=0; S.seasonFactor=1; S.skipMid=false; S.mG=0; S.mA=0; /* 帶傷踢大賽的後遺症延到本季 */
  S.form=clamp(50+Math.round((S.form-50)*0.3),0,100); /* 狀態每季重置,保留三成 */
  if(S.age>=(isGK()?42:40)){ endGame(`體能已到極限，${S.year} 年夏天宣布引退。`); return; }
  /* 年齡衰退:場上 31 歲起、門將 33 歲起;速度/體能加倍,傳球/視野幾乎不退 */
  const declAge=S.age-(S.traits.disc?2:0), declStart=isGK()?33:31;
  if(declAge>=declStart){ const n=declAge-declStart, dec=n>=4?4+(n-4):2;
    const mul={pac:2,sta:2,vis:.25,pas:.25};
    GRP_AB[S.grp].forEach(k=>{ const d=Math.round(dec*(mul[k]??1)); if(d>0)S.ab[k]=clamp(S.ab[k]-d,1,80); });
    card('bad','歲月不饒人',`${n>=4?'第二階段（逐年加劇）':'第一階段'}衰退：能力 <b class="dn">−${dec}</b>，速度與體能加倍流失，傳球與視野幾乎不受影響。`); board(0); }
  if(S.rehab>0){ S.rehab--; S.skipMid=true; S.seasonFactor=0;
    card('bad','復健年','重傷尚未痊癒，本季確定<b class="dn">全年報銷</b>。（訓練減為 2 堂）'); }
  if(S.milNext){ S.milNext=false; S.mil='served'; S.seasonFactor*=0.6;
    card('info','服役年','本季一邊服役一邊踢球，出賽時間減少。服役結束後就沒有後顧之憂了。'); }
  posReview(()=>squadReview(training));
}
/* 位置審查:同大類或相鄰位置 OVR 高 4 以上,教練提議轉位 */
function posReview(cont){
  if(S.skipMid||(S.stage==='YOUTH'&&S.stageYr<2)){ cont(); return; }
  const cur=ovrAt(S.dpos); let best=S.dpos, bv=cur;
  [...DP_OF[S.grp],...(DP_ADJ[S.dpos]||[])].forEach(dp=>{ const v=ovrAt(dp); if(v>bv){bv=v;best=dp;} });
  if(best===S.dpos||bv-cur<4){ cont(); return; }
  choose(`教練建議轉任${DPN[best]}（綜合 ${cur} → ${bv}）`,[
    {t:`接受，改踢${DPN[best]}`,main:true,f:()=>{ const old=DPN[S.dpos]; S.dpos=best; S.rivals=[]; /* 換位置就換一批競爭者 */
      if(++S.posChanges>=2&&!S.traits.versatile)traitCard('versatile','教練要你踢哪裡，你就能踢哪裡——<b class="hl">拒絕轉位不再影響上場時間</b>。');
      card('info','位置調整',`從${old}轉任 <b class="hl">${DPN[best]}</b>，綜合評價 ${cur} → <b class="up">${bv}</b>。`); board(0); cont(); }},
    {t:`堅持踢${DPN[S.dpos]}`,warn:true,s:S.traits.versatile?'全能戰士：不影響教練信任':'教練信任 −12',f:()=>{ const tx=S.traits.versatile?'':meter('trust',-12);

}
/* ---------- 隊內競爭:同位置 1–2 名虛擬隊友,OVR 落在球隊 par −6～+10 ---------- */
function curPar(){ return S.stage==='YOUTH'?YOUTH_PAR[S.youthTier]:S.stage==='UNI'?UNI_PAR[S.uniTier]:LV[S.lv].par+TIER_PAR[S.clubTier]; }
function rivalName(){ const L=NAMES[S.stage==='PRO'?LV[S.lv].cty:S.nat]; return pick(L[0])+pick(L[1]); }
function newRival(){ return {name:rivalName(),ovr:clamp(curPar()+ri(-6,10),15,80),age:S.stage==='YOUTH'?S.age+ri(-1,1):S.stage==='UNI'?S.age+ri(-1,2):ri(19,31)}; }
const roleOf=gap=>gap>=3?0:gap>=-2?1:gap>=-7?2:3;
const rivalTop=()=>S.rivals.length?Math.max(...S.rivals.map(r=>r.ovr)):0;
function squadReview(cont){
  if(S.skipMid){ cont(); return; }
  const gone=[];
  S.rivals.forEach(r=>{ r.age++; r.ovr=clamp(r.ovr+(r.age<=26?ri(0,3):r.age<=30?ri(-1,1):-ri(1,3)),15,80); });
  S.rivals=S.rivals.filter(r=>{ if(r.age>=34||chance(20)){ gone.push(r.name); return false; } return true; });
  fillRivals(gone.length?`${gone.join('、')} 離隊。`:'');
  cont();
}
/* 補滿同位置競爭者並公告;隊上原本就有人時,新加入者標「新援」 */
function fillRivals(intro){
  const fresh=!S.rivals.length, news=[], want=isGK()?1:ri(1,2);
  while(S.rivals.length<want){ const r=newRival(); S.rivals.push(r); news.push(r); }
  const mine=ovr(), role=roleOf(mine-rivalTop());
  const list=S.rivals.map(r=>`${r.name}（${r.age} 歲・綜合 ${r.ovr}）${!fresh&&news.includes(r)?'<b class="hl">新援</b>':''}`).join('、');
  card('info','位置競爭',`${intro||''}${S.club||S.team} ${DPN[S.dpos]}位置的競爭者：${list}。<br>你的綜合 ${mine}，預估角色 <b class="hl">${ROLES[role][0]}</b>。`);
}
/* 覺醒(天才/大器晚成):兩項未滿 70 的能力 +5、潛力上限 +10 */
function awaken(){ const cands=shuffle(GRP_AB[S.grp].filter(k=>S.ab[k]<70)), bl=[];
  cands.slice(0,2).forEach(k=>{ S.pot[k]=Math.min(80,(S.pot[k]||62)+10);
    S.ab[k]=clamp(S.ab[k]+5,1,80); bl.push(`${ABL[k]} <b class="up">+5</b>（潛力上限 +10 → ${S.pot[k]}）`); });
  return bl.length?`潛能重新被評估：${bl.join('、')}。`:''; }

function loveGainTxt(k,amt){ /* 加點機制同事件卡;超過潛力的部分轉為本季成績加成 */
  const before=S.pendStat, g=addAbStat(k,amt), over=S.pendStat-before;
  if(g>0&&over>0)return `<b class="up">${ABL[k]} +${g}</b>（溢出 ${over} 點轉為本季成績加成）`;
  if(g>0)return `<b class="up">${ABL[k]} +${g}</b>`;
  if(over>0)return `<b class="up">本季成績加成 +${over}</b>（${ABL[k]} 已達潛力上限）`;
  return `${ABL[k]} 能力加點，但不足以提升一級`;
}
function abLose(k,n){ let lost=0; for(let i=0;i<n;i++){ if(!(k in S.ab))break;
    if((S.carry[k]||0)>0){ S.carry[k]--; lost++; } else if(S.ab[k]>1){ S.ab[k]--; S.carry[k]=lvCost(k,S.ab[k])-1; lost++; } }
  return lost; }
function addAbStat(k,amt){
  if(amt<=0)return addAb(k,amt);
  const pk=(S.pot&&S.pot[k])||62; let cur=S.ab[k], bud=amt, cr=S.carry[k]||0, gained=0;
  if(cur>=pk){ S.pendStat+=bud; return 0; }
  while(bud>0&&cur<pk){ bud--; cr++; if(cr>=stepCost(cur)){ cr-=stepCost(cur); cur++; gained++; } }
  S.carry[k]=cr; S.ab[k]=cur; if(bud>0)S.pendStat+=bud;
  return gained;
}

/* ---------- 賽季中 ---------- */
function phaseMid(){
  board(1);
  if(S.skipMid){ logSeason({App:0,Min:0,G:0,A:0,Rt:0,CS:0,GA:0,role:'—',d:0},'復健年・全年報銷',true); nextStep(); return; }
  loveEvent(()=>keyMoments(2,()=>dialogEvent(()=>winterWindow(()=>{
    choose('',[{t:'▸ 季中健康檢查',main:true,f:()=>{ rollInjury();
      choose('',[{t:'▸ 查看賽季表現',main:true,f:seasonResult}]); }}]);
  }))));

function injuryProb(){
  let p=12+S.tmpInj-(S.ab.sta-40)*0.1+((S.fatigue??30)-30)*0.2; /* 訓練疲勞 */
  if(!isGK())p-=(S.ab.phy-40)*0.15;
  if(S.age>=30)p+=(S.age-29)*1.5;
  if(S.traits.scholar&&S.age<27)p-=5; /* 學院派 */
  if(S.ntRetired)p-=3; /* 退出國家隊,少了國際賽奔波 */
  if(S.traits.iron)p=Math.min(p,10);  /* 鐵人 */
  if(S.traits.glass)p=Math.max(p,35); /* 玻璃人 */
  return clamp(p,3,60);
}
function rollInjury(){
  if(!chance(injuryProb())){ card('good','健康檢查','身體狀況良好，整季沒有傷停。'); return; }
  if(chance(15)){ S.seasonFactor*=0.5; S.bigInj++;
    if(chance(30)){ S.rehab=1; card('bad','重傷','韌帶斷裂，本季後半報銷，<b class="dn">下季也要全年復健</b>。'); }
    else card('bad','重傷','肌腱撕裂，缺席<b class="dn">半個賽季</b>。');
    /* 32 歲前第二次大傷才定性為玻璃體質;之後算老化 */
    if(S.bigInj>=2&&!S.traits.glass&&!S.traits.phoenix&&S.age<32)
      traitCard('glass','生涯第二次大傷。從此傷病如影隨形，未來每季受傷機率<b class="dn">不低於 35%</b>。','bad');
    return; }
  const w=ri(2,8); S.seasonFactor*=clamp(1-w*0.025,0.8,0.95);
  card('bad','小傷',`肌肉拉傷，缺席 <b class="dn">${w} 週</b>。`);
}
/* 上場地位:[名稱, 出場比例下限, 上限, 平均分鐘下限, 上限] */
const ROLES=[['主力',.80,1.0,80,90],['輪替',.53,.79,55,75],['替補',.26,.58,20,40],['板凳',0,.26,10,25]];
/* 與最強競爭者比較定角色;事件／拒絕轉位修正;季中狀態火燙可升一級 */
function seasonRole(){
  let r=clamp(roleOf(ovr()-rivalTop()+trustGap())-S.roleAdj,0,3); S.roleAdj=0;
  if(r>0&&(S.pendStat>=3||S.form>=75||(ovr()-curPar()>=5&&chance(40)))){ r--;
    card('good','季中逆襲',`狀態火燙，教練把你拉上更重要的角色：<b class="up">${ROLES[r][0]}</b>。`); }
  return r;
}
function simSeason(par,games,r){
  const d=ovr()-par, f=S.seasonFactor;
  const [rn,a,b,m1,m2]=ROLES[r];
  const app=Math.round(games*(a+R()*(b-a))*f);

/* 季末積分榜:依本季結果決定自己的名次,其他球隊依強弱加上隨機 */
function leagueTable(res){
  const L=LV[S.lv], g=L.g, n=TEAMS[S.lv].length+(TEAMS[S.lv].includes(S.club)?0:1), zone=n>=16?3:n>=12?2:1, me=S.club, t=S.clubTier;
  const mine=res==='champ'?1:res==='up'?ri(2,3):res==='down'?ri(n-zone+1,n):
    t===1?ri(2,Math.min(6,n-zone-1)):t===3?ri(Math.max(2,n-zone-4),n-zone):ri(Math.max(2,Math.round(n*0.3)),Math.round(n*0.7));
  /* 其他球隊:目標名次 = 強弱序換算 ± 隨機,再依序放進空位 */
  const others=TEAMS[S.lv].filter(x=>x!==me), used={[mine]:me};
  others.map((x,i)=>({x,tg:1+i/(Math.max(1,others.length-1))*(n-1)+ri(-2,2)})).sort((a,b)=>a.tg-b.tg).forEach((o,k)=>{ if(k===0&&mine!==1)o.tg=1; /* 冠軍一定是列名的球隊 */

  const wdl=P=>{ let d=clamp(Math.round(g*0.22)+ri(-3,3),0,g), w=Math.floor((P-d)/3); d=P-3*w; if(w+d>g){ d=Math.max(0,g-w); } return [w,d,Math.max(0,g-w-d)]; };

    `<div class="tblwrap"><table class="fin ltab"><tr><th>#</th><th>球隊</th><th>勝</th><th>和</th><th>敗</th><th>積分</th></tr>${rows}</table></div>`);
}

/* ---------- 合約與報價 ---------- */
function tierOf(lv,club){ const a=TEAMS[lv], i=a.indexOf(club), n=a.length; return i<0?2:i<n/4?1:i>=n*3/4?3:2; }
const ctYears=()=>S.age>=32?ri(1,2):S.age>=28?ri(2,3):ri(3,5); /* 年輕球員簽長約 */

function makeOffers(lv,n,ex){

  return shuffle(cands).slice(0,n).map(club=>({lv,club,tier:tierOf(lv,club),yrs:ctYears()}));

/* 對你有興趣的聯賽(par 高到低):過簽約門檻;往上跳需達該聯賽 par−1;工作證;首次登陸歐洲需 par+球探打折 且未滿 30 歲 */
function leagueCands(allowDown){
  const o=ovr(), cur=S.lv?LV[S.lv].par:0, inEU=!!(S.lv&&LV[S.lv].eu), N=NATS[S.nat];
  return Object.keys(LV).filter(k=>{ const L=LV[k];
    if(L.local&&!N.home.includes(k))return false; /* 小聯賽只簽本國球員 */
    if(o<L.min)return false;
    if(L.wp&&N.wp&&o<L.par+3-(S.caps>=30?2:S.caps>=10?1:0))return false; /* 工作證:國家隊出賽多可降門檻 */
    if(L.par>cur&&o<L.par-1)return false;

    if(L.top5&&!(S.lv&&LV[S.lv].top5)&&o<L.par+N.scout)return false; /* 首次進五大:依國籍球探打折(弱國 +2、中 +1、強國 0) */
    if(!allowDown&&L.par<cur)return false;
    return true; }).sort((a,b)=>LV[b].par-LV[a].par);

/* 報價多集中在最高的三個聯賽 */
function genOffers(n,allowDown){
  const ls=leagueCands(allowDown), out=[], used=new Set([S.club]);
  if(!ls.length)return out;
  const top=ls.slice(0,3);
  for(let i=0;i<n*4&&out.length<n;i++){
    const of=makeOffers(pick(R()<0.7?top:ls),1)[0];
    if(of&&!used.has(of.club)){ used.add(of.club); out.push(of); } }
  return out;
}
/* 報價數:上季評分越高越多;自由球員 +1、申請轉會 +1 */
function offerCount(fa){
  const last=S.log[S.log.length-1], rt=last?last.st.Rt:0;
  return (rt>=7.3?ri(2,3):rt>=6.9?ri(1,2):ri(0,1))+(fa?1:0)+(S.wantOut?1:0)+(S.fans>=75?1:0); /* 高人氣多一份 */
}
const ofName=of=>`${of.club}（${LV[of.lv].n}・${TIERN[of.tier]}）`;
function offerOpt(of,main,title){
  const est=salaryFor(of.lv,ovr()-LV[of.lv].par,TIER_PAY[of.tier]);
  return {t:title||ofName(of),main,offer:1,
    s:`${of.yrs} 年｜年薪約 ${fmtMoney(est)}｜${TIER_DESC[of.tier]}`,f:()=>negotiate(of,()=>signTo(of))};
}
function signTo(of){
  if(of.club!==S.club)S.rivals=[]; /* 換隊就換一批競爭者 */
  S.stage='PRO'; S.lv=of.lv; S.club=of.club; S.clubTier=of.tier; S.loan=null;
  if(of.club!==S.club){ S.newSign=true; S.trust=50; } /* 新加盟第一個夏窗不會被賣、也沒人來談;教練信任重新開始 */
  S.ct={yrs:of.yrs,mult:TIER_PAY[of.tier],lv:of.lv}; S.wantOut=false; S.relegated=false;
  card('gold','簽約',`與 <b class="hl">${of.club}</b>（${LV[of.lv].n}・${TIERN[of.tier]}）簽下 <b class="hl">${of.yrs} 年</b>合約。`);
  board(2);
}
/* 大學季末:世大運(奇數年)→ 大二、大三可提前轉職業 → 大四畢業 */

    /* 大二、大三:只有 J2 級(par ≥ 40)以上、且綜合高出該聯賽 2 點的球隊會來挖人 */
    if(S.stageYr>=2&&chance(50)){ const of=genOffers(ri(1,2),true).filter(x=>LV[x.lv].par>=Math.max(40,LV[homeTop()].par)&&ovr()>=LV[x.lv].par+2);
      if(of.length){ choose(`大${UNI_YR[S.stageYr-1]}結束 · 職業球隊來敲門`,[
        {t:'留在學校，拿到學位再說',main:true,s:'畢業可覺醒「學院派」',f:advance},
        ...of.map(x=>({t:`休學加盟 ${ofName(x)}`,warn:true,s:`${x.yrs} 年｜放棄學位與「學院派」`,f:()=>{
          card('info','休學轉職業',`你在 ${S.uni} 辦了休學，提早踏進職業足壇。`); signTo(x); advance(); }}))]); return; } }
    advance(); };
  if(S.pool>0){ const p=S.pool; S.pool=0; choose('',[{t:`▸ 分配能力點（${p} 點・世大運）`,main:true,f:()=>allocUI({pool:p},'季末能力點分配（世大運）',go)}]); }
  else go();
}
/* 世界大學運動會:奇數年舉辦,綜合夠高才入選;依國家實力擲名次 */
function universiade(){
  if(S.year%2===0||ovr()<NATS[S.nat].nt-8)return;
  const t=NATS[S.nat].tier, rk=R()*100, medal=rk<[25,18,12,7,4][t-1]?'金牌':rk<[45,34,24,15,9][t-1]?'銀牌':rk<[60,48,36,24,15][t-1]?'銅牌':null;
  S.pool+=medal?3:1;
  if(medal){ S.uniMedal++; S.honors.push(`${S.year} 世大運（${medal}）`); }
  card(medal?'gold':'info','世界大學運動會',`入選${NATS[S.nat].n}大學代表隊，${medal?`拿下 <b class="hl">${medal}</b>！`:'止步淘汰賽。'}（能力點 +${medal?3:1}）`);
}
function uniExit(){

  traitCard('scholar','四年的科學化訓練與運動防護課程打下扎實基礎——<b class="hl">27 歲前受傷率 −5%、每堂訓練課至少 2 星</b>。');
  /* 本土保底 1 份 + 依能力的各聯賽報價;本土聯賽弱的國家,能力夠可赴日韓次級 */

  const top=homeTop(); if(top!==homeLow()&&o>=LV[top].min)makeOffers(top,1).forEach(x=>{ if(!used.has(x.club)){ used.add(x.club); offers.push(x); } });
  genOffers(o>=46?3:o>=40?2:1,true).forEach(x=>{ if(!used.has(x.club)){ used.add(x.club); offers.push(x); } });
  const opts=offers.map((of,i)=>offerOpt(of,i===0));

}

/* 夏窗:合約內的轉會、租借、申請轉會、被動出售 */

  const last=S.log[S.log.length-1], rt=last?last.st.Rt:0;
  const interest=!fresh&&chance(15+(rt>=7.3?35:rt>=6.9?10:0)+(S.ct.yrs===1?20:0)+(S.wantOut?30:0)+(S.rumor?20:0)); S.rumor=false;
  /* 被動出售:球隊收到報價想賣人;拒絕則下季上場地位 −1 */

      {t:`同意轉會至 ${ofName(b)}`,main:true,s:`${b.yrs} 年｜${TIER_DESC[b.tier]}`,f:()=>{ card('good','轉會',`${S.club}以約 ${fmtMoney(mv)} 的價格把你賣給 ${b.club}。`); signTo(b); advance(); }},

      return; } }
  const offers=interest?genOffers(Math.max(1,offerCount(false)),lastRole>=2):[];
  /* 降級條款:上級聯賽球隊來挖角 */
  if(S.relegated){ const up=Object.keys(LV).find(k=>LV[k].rel===S.lv), of=up&&ovr()>=LV[up].min&&makeOffers(up,1,S.club)[0];
    if(of&&!offers.some(x=>x.club===of.club))offers.unshift(of); }
  const opts=[{t:'▸ 留隊，進入下一季',main:true,stay:1,f:advance}];

    opts.push({t:`轉會：${ofName(of)}`,offer:1,s:`${of.yrs} 年｜轉會費約 ${fmtMoney(fee)}｜${TIER_DESC[of.tier]}`,f:()=>{

      negotiate(of,()=>{ card('good','轉會成功',`${of.club}支付約 ${fmtMoney(fee)} 轉會費，把你帶走。`); signTo(of); }); }}); });
  if(S.age<=23&&lastRole>=2){ const lo=loanOffer();
    if(lo)opts.push({t:`租借：${ofName(lo)}`,s:'為期一季，累積上場時間後歸隊',f:()=>{ startLoan(lo); advance(); }}); }
  if(!S.wantOut)opts.push({t:'申請轉會',warn:true,s:'下次更容易有人來談、球隊比較願意放人；但教練信任 −12',f:()=>{
    S.wantOut=true; card('bad','申請轉會',`你向球團表達想離隊的意願，更衣室氣氛變得微妙。${meter('trust',-12)}`); advance(); }});
  if(S.age>=30)opts.push(retireOpt());
  choose(`夏季轉會窗 · 合約剩 ${S.ct.yrs} 年 · 身價約 ${fmtMoney(mv)}`,opts);
}
/* 冬窗:預估角色為替補/板凳才有人找;23 歲以下可租借,板凳球員 30% 有轉會報價 */
function winterWindow(cont){
  if(S.stage!=='PRO'||S.loan){ cont(); return; }
  const role=clamp(roleOf(ovr()-rivalTop()+trustGap())-S.roleAdj,0,3);

  const of=role===3&&chance(30)?genOffers(1,true)[0]:null; /* 冬窗以租借為主;只有坐板凳時偶爾有轉會報價 */

}
/* 租借:去低 3～12 par 的聯賽,只找中游/保級球隊 */
function loanOffer(){
  const P=LV[S.lv].par, o=ovr();
  const ls=Object.keys(LV).filter(k=>{ const L=LV[k]; return L.par<=P-3&&L.par>=P-12&&o>=L.min&&!(L.wp&&NATS[S.nat].wp&&o<L.par+3)&&!(L.local&&!NATS[S.nat].home.includes(k)); });
  if(!ls.length)return null;
  const lv=pick(ls), club=pick(TEAMS[lv].filter(t=>tierOf(lv,t)>=2));
  return {lv,club,tier:tierOf(lv,club),yrs:1};
}
function startLoan(of){
  S.loan={lv:S.lv,club:S.club,tier:S.clubTier,rivals:S.rivals,trust:S.trust};
  S.lv=of.lv; S.club=of.club; S.clubTier=of.tier; S.rivals=[]; S.trust=55;
  card('info','租借',`租借至 <b class="hl">${of.club}</b>（${LV[of.lv].n}・${TIERN[of.tier]}），為期一季。薪水仍由母隊支付。`);

}
function endLoan(){
  const L=S.loan; S.loan=null;
  S.lv=L.lv; S.club=L.club; S.clubTier=L.tier; S.rivals=L.rivals; S.trust=L.trust??50;
  const grew=ovr()>=curPar(), tx=grew?meter('trust',10):'';

function contractEnd(){

const T_WC={n:'世界盃',st:['小組賽','32 強','16 強','8 強','4 強','決賽'],g:[.8,.65,.5,.35,.25],k:[.5,.42,.35,.25,.18]};

const ntBonus=()=>clamp((ovr()-NATS[S.nat].nt)*0.005,0,0.1);

function wcQualRate(){ const N=NATS[S.nat]; return clamp(N.wc+(S.ntOn?Math.min(N.cap,Math.max(0,ovr()-50)*0.8):0),0,98); }
function natCall(cont){

function natCallRoll(cont){

function intlYear(Y,cont){

  if(Y>=2026&&Y%4===2)q.push(()=>u23Cycle(T_AG,Y,true,next));
  if(Y>=2028&&Y%4===0)q.push(()=>u23Cycle(T_OLY,Y,false,next));

      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'足球生涯結算',text:S.name+' 的足球人生'}); return; }
    }catch(e){ if(e&&e.name==='AbortError')return; }
    dl(); };
}

/* ================= 開場設定 ================= */
(function(){ const t=$('act-toggle');
  if(t)t.onclick=()=>{ $('act').classList.toggle('collapsed');
    t.textContent=$('act').classList.contains('collapsed')?'⌃ 展開選項':'⌄ 收合選項'; };
})();
$('bd-abt').onclick=function(){ const on=$('bd-ab').classList.toggle('open'); /* 預設展開,只記住「收起」 */
  this.textContent=on?'收起能力 ▴':'展開全部能力 ▾'; try{localStorage.setItem('fl_abshut',on?'':'1');}catch(e){} };
try{ if(localStorage.getItem('fl_abshut')){ $('bd-ab').classList.remove('open'); $('bd-abt').textContent='展開全部能力 ▾'; } }catch(e){}
$('btn-side').onclick=()=>$('side').classList.add('open'); $('side-x').onclick=()=>$('side').classList.remove('open');
$('btn-restart').onclick=function(){ if(confirm('確定要放棄這段人生，從頭開始嗎？'))location.href=location.pathname; };
let selGrp='FW', selNat='TW';
function natDesc(){ const n=NATS[selNat]; $('nat-desc').textContent=`國家隊實力：${NAT_TIERN[n.tier]}｜世界盃基準出線率 ${n.wc}%｜本土聯賽：${n.home.map(k=>LV[k].n).join('、')}${n.mil?'｜有兵役':''}`; }
document.querySelectorAll('#seg-nat button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg-nat button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selNat=b.dataset.v; natDesc();
});
natDesc();
$('seed-show').value=SEED;
$('seed-re').onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$('seed-show').value=SEED;};
document.querySelectorAll('#seg-pos button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg-pos button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selGrp=b.dataset.v;
});
$('btn-start').onclick=()=>{
  const nm=$('in-name').value.trim()||'無名小將';
  const sv=$('seed-show').value.trim(); if(sv)SEED=sv;
  history.replaceState(null,'','?seed='+encodeURIComponent(SEED));
  seedInit(SEED);
  S=newState(nm,selGrp,selNat);
  $('start').style.display='none';
  $('board').style.display=''; $('act').style.display='';
  card('info','球員誕生',`${S.year} 年夏天，${NATS[S.nat].n}${GRPN[S.grp]} <b class="hl">${S.name}</b> 加入 <b class="hl">${S.team}</b>。三年後的路，要自己選。<br><span style="color:var(--dim);font-size:12px">提示：21 歲前完成 5 堂滿強度（6 星）訓練可覺醒隱藏特質。關鍵時刻記得看球探情報。</span>`);
  startYear();
};
$('ver-badge').textContent=APP_VER;
</script>
</body>
</html>
